services:
  db:
    image: postgres:16-alpine
    container_name: phonghub-db
    environment:
      POSTGRES_DB: ${PHONGHUB_DB_NAME:-phonghub}
      POSTGRES_USER: ${PHONGHUB_DB_USER:-phonghub}
      POSTGRES_PASSWORD: ${PHONGHUB_DB_PASSWORD:-phonghub_local_only}
    ports:
      - "${PHONGHUB_DB_PORT:-55432}:5432"
    volumes:
      - phonghub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: phonghub-redis
    ports:
      - "${PHONGHUB_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phonghub-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PHONGHUB_DB_HOST: db
      PHONGHUB_DB_PORT: 5432
      PHONGHUB_DB_NAME: ${PHONGHUB_DB_NAME:-phonghub}
      PHONGHUB_DB_USER: ${PHONGHUB_DB_USER:-phonghub}
      PHONGHUB_DB_PASSWORD: ${PHONGHUB_DB_PASSWORD:-phonghub_local_only}
      PHONGHUB_REDIS_HOST: redis
      PHONGHUB_REDIS_PORT: 6379
      TENANT_DATA_KEY_ID: ${TENANT_DATA_KEY_ID:?TENANT_DATA_KEY_ID is required}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:?TENANT_DATA_ENCRYPTION_KEY is required}
      TENANT_DATA_HMAC_KEY: ${TENANT_DATA_HMAC_KEY:?TENANT_DATA_HMAC_KEY is required}
      SEPAY_SANDBOX_CHECKOUT_ENABLED: ${SEPAY_SANDBOX_CHECKOUT_ENABLED:-false}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_PUBLIC_BASE_URL: ${SEPAY_PUBLIC_BASE_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: phonghub-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    container_name: phonghub-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-opensearch-datasource"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: phonghub-opensearch
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - phonghub_opensearch_data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: phonghub-opensearch-dashboards
    profiles: ["observability"]
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: phonghub-fluent-bit
    profiles: ["observability"]
    ports:
      - "24224:24224"
      - "5170:5170"
    volumes:
      - ./ops/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./ops/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      - opensearch

volumes:
  phonghub_pgdata:
  phonghub_opensearch_data:
