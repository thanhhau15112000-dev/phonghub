[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          5170
    Format        json

[INPUT]
    Name          tail
    Path          /var/log/phonghub/*.log
    Parser        json
    Tag           phonghub.logs

[OUTPUT]
    Name                opensearch
    Match               *
    Host                opensearch
    Port                9200
    Index               phonghub-logs
    Logstash_Format     On
    Logstash_Prefix     phonghub-logs
    Logstash_DateFormat %Y.%m.%d
    HTTP_User           admin
    HTTP_Passwd         admin
    tls                 Off
    Suppress_Type_Name  On

