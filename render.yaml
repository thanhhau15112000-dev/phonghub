services:
  - type: web
    name: phonghub
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Session store của UI: phiên đăng nhập giữ được qua restart/redeploy
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: phonghub-sessions
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: TENANT_DATA_KEY_ID
        sync: false
      - key: TENANT_DATA_ENCRYPTION_KEY
        sync: false
      - key: TENANT_DATA_HMAC_KEY
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: SEPAY_BANK_CODE
        sync: false
      - key: SEPAY_BANK_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_BANK_ACCOUNT_NAME
        sync: false
      - key: SEPAY_SANDBOX_CHECKOUT_ENABLED
        sync: false
      - key: SEPAY_MERCHANT_ID
        sync: false
      - key: SEPAY_SECRET_KEY
        sync: false
      - key: SEPAY_PUBLIC_BASE_URL
        sync: false

  - type: keyvalue
    name: phonghub-sessions
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    # Chỉ nhận kết nối nội bộ từ service cùng tài khoản Render
    ipAllowList: []
