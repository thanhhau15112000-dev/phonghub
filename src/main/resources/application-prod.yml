phonghub:
  demo:
    enabled: false
  rate-limit:
    # Prod chạy sau reverse proxy (Render): IP khách lấy từ X-Forwarded-For do proxy thêm vào.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:true}
    trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
  security:
    tenant-data:
      key-id: ${TENANT_DATA_KEY_ID}
      encryption-key: ${TENANT_DATA_ENCRYPTION_KEY}
      hmac-key: ${TENANT_DATA_HMAC_KEY}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        secure: true
        same-site: strict

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  jwks-uri: ${SUPABASE_JWKS_URI}
  jwt-issuer: ${SUPABASE_JWT_ISSUER}
  jwt-audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
