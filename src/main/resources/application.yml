spring:
  profiles:
    default: docker
  application:
    name: phonghub
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      # JPA được cấu hình tường minh trong JpaPersistenceConfiguration (chỉ profile prod/docker).
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  datasource:
    # Pool Hikari cho profile dùng Postgres (prod/docker). Supabase giới hạn số kết nối đồng thời của cả project,
    # nên pool nhỏ; thời gian sống của kết nối ngắn hơn ngưỡng cắt kết nối nhàn rỗi của mạng/proxy.
    hikari:
      pool-name: phonghub-db
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: 300000
      keepalive-time: 120000
      max-lifetime: 1500000
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
      max-request-size: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

phonghub:
  demo:
    enabled: false
  handover:
    # Nút "Bỏ qua" đưa biên bản check-in/check-out thẳng tới APPROVED, chỉ dùng khi demo.
    skip-enabled: ${HANDOVER_SKIP_ENABLED:false}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:private-files}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
    signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:600}
  invoicing:
    auto-generate: true
    # Nhắc người thuê hóa đơn sắp đến hạn lúc 07:00 hằng ngày (#86)
    due-reminder-enabled: ${INVOICE_DUE_REMINDER_ENABLED:true}
    due-reminder-days: ${INVOICE_DUE_REMINDER_DAYS:3}
  contracts:
    expiry-job-enabled: ${CONTRACT_EXPIRY_JOB_ENABLED:true}
    expiry-reminder-days: ${CONTRACT_EXPIRY_REMINDER_DAYS:30}
  # OCR chỉ số đồng hồ (#67). "tesseract" cần lệnh tesseract (image Docker đã cài sẵn); máy không có lệnh thì tự về
  # nhập tay. Kết quả dưới min-confidence không được điền sẵn, người dùng phải tự nhập.
  ocr:
    engine: ${METER_OCR_ENGINE:disabled}
    min-confidence: ${METER_OCR_MIN_CONFIDENCE:0.85}
    tesseract:
      command: ${TESSERACT_COMMAND:tesseract}
      timeout-seconds: ${TESSERACT_TIMEOUT_SECONDS:15}
      max-concurrent: ${TESSERACT_MAX_CONCURRENT:1}
  # Cache danh sách nhà trọ/phòng và dashboard owner (#88); xóa khi dữ liệu đổi, TTL là lưới an toàn
  cache:
    enabled: ${CACHE_ENABLED:true}
    ttl-seconds: ${CACHE_TTL_SECONDS:300}
    max-size: ${CACHE_MAX_SIZE:1000}
  sepay:
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
    allow-unsigned-webhook: false
    bank-code: ${SEPAY_BANK_CODE:}
    bank-account-number: ${SEPAY_BANK_ACCOUNT_NUMBER:}
    bank-account-name: ${SEPAY_BANK_ACCOUNT_NAME:}
    sandbox-checkout-enabled: ${SEPAY_SANDBOX_CHECKOUT_ENABLED:false}
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    public-base-url: ${SEPAY_PUBLIC_BASE_URL:}
  chat:
    supabase-bucket: ${SUPABASE_CHAT_BUCKET:chat-media}
