<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hợp đồng')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-title-row">
        <div>
            <h1>Hợp đồng</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Quản lý hợp đồng thuê, kích hoạt, người ở và chấm dứt hợp đồng.</p>
        </div>
        <div>
            <a th:if="${currentUser != null and (currentUser.role().name() == 'ADMIN' or currentUser.role().name() == 'STAFF')}"
               th:href="@{/contracts/new}" class="btn btn-primary">+ Tạo hợp đồng</a>
        </div>
    </div>

    <div class="card">
        <div th:if="${#lists.isEmpty(contracts)}" class="empty-state">
            <p>Không tìm thấy hợp đồng.</p>
        </div>

        <table th:if="${!#lists.isEmpty(contracts)}" class="data-table">
            <thead>
                <tr>
                    <th>Mã hợp đồng</th>
                    <th>Thời hạn</th>
                    <th>Tiền thuê</th>
                    <th>Tiền đặt cọc</th>
                    <th>Ngày thanh toán</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${contracts}">
                    <td>
                        <a th:href="@{'/contracts/' + ${c.getId()}}" th:text="${#strings.substring(c.getId().toString(), 0, 8) + '...'}" style="font-weight: 600;">Mã</a>
                    </td>
                    <td th:text="${c.getStartDate()} + ' đến ' + ${c.getEndDate()}">2026-01-01 đến 2027-01-01</td>
                    <td th:text="${#numbers.formatDecimal(c.getRentAmount(), 0, 'COMMA', 0, 'POINT') + ' đ'}">3,500,000 đ</td>
                    <td th:text="${#numbers.formatDecimal(c.getDepositAmount(), 0, 'COMMA', 0, 'POINT') + ' đ'}">3,500,000 đ</td>
                    <td th:text="'Ngày ' + ${c.getPaymentDay()}">Ngày 5</td>
                    <td>
                        <span th:class="'badge badge-' + ${c.getStatus()}" th:text="${uiText.contractStatus(c.getStatus())}">Bản nháp</span>
                    </td>
                    <td>
                        <a th:href="@{'/contracts/' + ${c.getId()}}" class="btn btn-sm">Quản lý</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
