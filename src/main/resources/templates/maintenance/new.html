<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Báo hỏng')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-title-row">
        <div>
            <h1>Báo hỏng phòng</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Tạo yêu cầu sự cố cho phòng được cấp quyền.</p>
        </div>
        <div>
            <a th:href="@{/maintenance}" class="btn">&larr; Quay lại danh sách bảo trì</a>
        </div>
    </div>

    <div class="card" style="max-width: 700px;">
        <form th:action="@{/maintenance}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label">Chọn phòng *</label>
                <select name="roomId" id="roomSelect" class="form-control" required>
                    <option value="">-- Chọn phòng --</option>
                    <option th:each="r : ${rooms}"
                            th:value="${r.getId()}"
                            th:attr="data-status=${r.getStatus().name()}"
                            th:text="${'Phòng ' + r.getRoomNumber() + (propertyNames.size() > 1 ? ' — ' + propertyNames.get(r.getPropertyId()) : '') + ' (' + uiText.roomStatus(r.getStatus()) + ')'}"
                            th:selected="${selectedRoomId != null and selectedRoomId.equals(r.getId())}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="causeSelect">Nguyên nhân sự cố <span th:if="${currentUser.role().name() == 'TENANT'}">*</span></label>
                <select name="cause" id="causeSelect" class="form-control" th:required="${currentUser.role().name() == 'TENANT'}">
                    <option value="">-- Chọn nguyên nhân --</option>
                    <option th:each="c : ${causes}" th:value="${c}" th:text="${uiText.maintenanceCause(c)}"></option>
                </select>
                <div id="causeHint" style="display: none; margin-top: 6px; padding: 8px 10px; border: 1px solid var(--border-color); font-size: 12px; color: var(--text-secondary);"></div>
            </div>

            <div class="form-group" id="causeDetailGroup" style="display: none;">
                <label class="form-label" for="causeDetail">Hạng mục</label>
                <select name="causeDetail" id="causeDetail" class="form-control"></select>
            </div>

            <div class="form-group">
                <label class="form-label">Tiêu đề sự cố *</label>
                <input type="text" name="title" class="form-control" placeholder="Ví dụ: Vòi nước trong nhà tắm bị hỏng" required>
            </div>

            <div class="form-group">
                <label class="form-label">Mô tả chi tiết *</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Mô tả vấn đề, vị trí và mức độ khẩn cấp..." required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Ảnh hoặc video sự cố</label>
                <div th:replace="~{fragments/attachment-picker :: attachmentPicker(0, 0, false)}"></div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Mức độ</label>
                    <select name="priority" class="form-control">
                        <option th:each="p : ${priorities}"
                                th:value="${p}"
                                th:text="${uiText.maintenancePriority(p)}"
                                th:selected="${p.name() == 'MEDIUM'}">
                        </option>
                    </select>
                </div>
                <!-- Chỉ người quản lý đổi trạng thái phòng, và chỉ với phòng đang trống -->
                <div th:if="${currentUser.role().name() != 'TENANT'}" class="form-group" style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 20px;">
                    <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" id="setRoomMaintenance" name="setRoomMaintenance" value="true">
                        Chuyển trạng thái phòng sang BẢO TRÌ
                    </label>
                    <small id="roomMaintenanceHint" style="display: none; color: var(--text-secondary); font-size: 11px;">
                        Phòng đang có người ở hoặc đã đặt: giữ nguyên trạng thái phòng, phiếu vẫn được tạo.
                    </small>
                </div>
            </div>

            <div style="margin-top: 16px;">
                <button type="submit" class="btn btn-primary">Gửi yêu cầu</button>
                <a th:href="@{/maintenance}" class="btn" style="margin-left: 8px;">Hủy</a>
            </div>
        </form>
    </div>
    <script>
        (function () {
            var config = {
                NATURAL_WEAR: {
                    hint: 'Hư hao do thời gian sử dụng: chủ trọ chịu chi phí sửa chữa.',
                    details: []
                },
                INFRASTRUCTURE: {
                    hint: 'Sự cố hạ tầng / kết cấu của nhà trọ: chủ trọ chịu chi phí sửa chữa.',
                    details: ['Điện âm tường', 'Đường nước / thoát nước', 'Dột, thấm, nứt tường trần', 'Khác']
                },
                TENANT_USAGE: {
                    hint: 'Hư hỏng do sử dụng: người thuê có thể phải chịu chi phí. Kỹ thuật viên sẽ báo giá sau khi sửa xong và bạn thanh toán qua ứng dụng.',
                    details: ['Cửa, khóa, chìa khóa', 'Điện, ổ cắm, thiết bị điện', 'Vòi, bồn, thiết bị vệ sinh', 'Nội thất, tài sản trong phòng', 'Khác']
                },
                UNKNOWN: {
                    hint: 'Kỹ thuật viên sẽ xác định nguyên nhân và bên chịu chi phí sau khi kiểm tra.',
                    details: []
                }
            };
            var select = document.getElementById('causeSelect');
            var hint = document.getElementById('causeHint');
            var detailGroup = document.getElementById('causeDetailGroup');
            var detail = document.getElementById('causeDetail');

            function render() {
                var entry = config[select.value];
                hint.style.display = entry ? 'block' : 'none';
                hint.textContent = entry ? entry.hint : '';
                detail.innerHTML = '';
                var items = entry ? entry.details : [];
                detailGroup.style.display = items.length ? 'block' : 'none';
                items.forEach(function (text) {
                    var option = document.createElement('option');
                    option.value = text;
                    option.textContent = text;
                    detail.appendChild(option);
                });
            }
            select.addEventListener('change', render);
            render();

            // Phòng trống mới chuyển được sang bảo trì; phòng đang ở/đã đặt thì khóa ô này
            var roomSelect = document.getElementById('roomSelect');
            var maintenanceBox = document.getElementById('setRoomMaintenance');
            var maintenanceHint = document.getElementById('roomMaintenanceHint');
            function syncMaintenanceBox() {
                if (!maintenanceBox) {
                    return;
                }
                var option = roomSelect.options[roomSelect.selectedIndex];
                var status = option ? option.getAttribute('data-status') : null;
                var locked = status === 'OCCUPIED' || status === 'RESERVED';
                maintenanceBox.disabled = locked;
                if (locked) {
                    maintenanceBox.checked = false;
                }
                maintenanceHint.style.display = locked ? 'block' : 'none';
            }
            roomSelect.addEventListener('change', syncMaintenanceBox);
            syncMaintenanceBox();
        })();
    </script>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
