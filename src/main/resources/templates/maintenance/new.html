<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Báo hỏng')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-title-row">
        <div>
            <h1>Báo hỏng phòng</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Tạo yêu cầu sự cố cho phòng được cấp quyền.</p>
        </div>
        <div>
            <a th:href="@{/maintenance}" class="btn">&larr; Quay lại danh sách bảo trì</a>
        </div>
    </div>

    <div class="card" style="max-width: 700px;">
        <form th:action="@{/maintenance}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label">Chọn phòng *</label>
                <select name="roomId" class="form-control" required>
                    <option value="">-- Chọn phòng --</option>
                    <option th:each="r : ${rooms}"
                            th:value="${r.getId()}"
                            th:text="${'Phòng ' + r.getRoomNumber() + ' (' + uiText.roomStatus(r.getStatus()) + ')'}"
                            th:selected="${selectedRoomId != null and selectedRoomId.equals(r.getId())}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Tiêu đề sự cố *</label>
                <input type="text" name="title" class="form-control" placeholder="Ví dụ: Vòi nước trong nhà tắm bị hỏng" required>
            </div>

            <div class="form-group">
                <label class="form-label">Mô tả chi tiết *</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Mô tả vấn đề, vị trí và mức độ khẩn cấp..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Mức độ</label>
                    <select name="priority" class="form-control">
                        <option th:each="p : ${priorities}"
                                th:value="${p}"
                                th:text="${uiText.maintenancePriority(p)}"
                                th:selected="${p.name() == 'MEDIUM'}">
                        </option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; display: flex; align-items: center; padding-top: 20px;">
                    <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" name="setRoomMaintenance" value="true" checked>
                        Chuyển trạng thái phòng sang BẢO TRÌ
                    </label>
                </div>
            </div>

            <div style="margin-top: 16px;">
                <button type="submit" class="btn btn-primary">Gửi yêu cầu</button>
                <a th:href="@{/maintenance}" class="btn" style="margin-left: 8px;">Hủy</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
