<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yêu cầu bảo trì')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-title-row">
        <div>
            <h1>Yêu cầu bảo trì</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Quản lý sự cố kỹ thuật, phân công, tiến độ xử lý và kết quả.</p>
        </div>
        <div>
            <a th:href="@{/maintenance/new}" class="btn btn-primary">+ Báo hỏng</a>
        </div>
    </div>

    <div class="card">
        <div th:if="${#lists.isEmpty(tickets)}" class="empty-state">
            <p>Không tìm thấy yêu cầu bảo trì trong phạm vi hiện tại.</p>
        </div>

        <table th:if="${!#lists.isEmpty(tickets)}" class="data-table">
            <thead>
                <tr>
                    <th>Tiêu đề và mô tả</th>
                    <th>Mức độ</th>
                    <th>Trạng thái</th>
                    <th>Chi phí sửa chữa</th>
                    <th>Ngày tạo</th>
                    <th class="col-actions">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${tickets}">
                    <td>
                        <a th:href="@{'/maintenance/' + ${t.getId()}}" th:text="${t.getTitle()}" style="font-weight: 600; color: var(--accent);">Tiêu đề</a>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;" th:text="${t.getDescription()}">Mô tả</div>
                    </td>
                    <td><span class="badge" th:text="${uiText.maintenancePriority(t.getPriority())}">Trung bình</span></td>
                    <td><span th:class="'badge badge-' + ${t.getStatus()}" th:text="${uiText.maintenanceStatus(t.getStatus())}">Đã báo</span></td>
                    <td th:text="${t.getRepairCost() != null and t.getRepairCost().compareTo(T(java.math.BigDecimal).ZERO) > 0 ? #numbers.formatDecimal(t.getRepairCost(), 0, 'COMMA', 0, 'POINT') + ' đ' : '—'}">—</td>
                    <td th:text="${#temporals.format(t.getCreatedAt(), 'yyyy-MM-dd HH:mm')}">2026-09-17</td>
                    <td class="col-actions">
                        <div class="table-actions">
                            <a th:if="${currentUser.role().name() == 'TENANT' and feeInvoices.containsKey(t.getId()) and feeInvoices.get(t.getId()).isPayable()}"
                               th:href="@{'/invoices/' + ${feeInvoices.get(t.getId()).getId()} + '/pay'}"
                               class="btn btn-sm btn-primary" title="Xem số tiền, mã chuyển khoản và QR">
                                <span>Thanh toán</span>
                            </a>
                            <a th:href="@{'/maintenance/' + ${t.getId()}}" class="btn btn-sm btn-secondary" title="Xem và cập nhật sự cố">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <span>Quản lý</span>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
