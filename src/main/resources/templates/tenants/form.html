<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Người thuê')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-title-row">
        <div>
            <h1 th:text="${tenant == null} ? 'Thêm người thuê' : 'Sửa thông tin người thuê'">Thêm người thuê</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Nhà trọ <strong th:text="${property.name()}">Nhà trọ</strong></p>
        </div>
        <div>
            <a th:href="@{'/properties/' + ${property.id()} + '/tenants'}" class="btn">&larr; Quay lại danh sách</a>
        </div>
    </div>

    <div class="card" style="max-width: 560px;">
        <form th:action="${tenant == null} ? @{'/properties/' + ${property.id()} + '/tenants'} : @{'/properties/' + ${property.id()} + '/tenants/' + ${tenant.id()} + '/edit'}"
              method="post" autocomplete="off">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <th:block th:if="${tenant == null}">
                <div th:replace="~{fragments/tenant-picker :: data(${tenantChoices})}"></div>
                <div class="form-group">
                    <label class="form-label">Ai là người thuê?</label>
                    <div th:replace="~{fragments/tenant-picker :: field('tenantProfileId', 'tenantUserId')}"></div>
                </div>
            </th:block>
            <div class="form-group">
                <label class="form-label" for="fullName">Họ và tên *</label>
                <input type="text" id="fullName" name="fullName" class="form-control" required maxlength="150"
                       th:value="${tenant != null} ? ${tenant.fullName()}">
            </div>
            <div class="form-group">
                <label class="form-label" for="identityCardNumber">Số CCCD <span th:if="${tenant == null}">*</span></label>
                <input type="text" id="identityCardNumber" name="identityCardNumber" class="form-control"
                       th:required="${tenant == null}" pattern="\d{9}|\d{12}" inputmode="numeric"
                       th:placeholder="${tenant != null} ? ${tenant.maskedIdentityCardNumber()} + ' (để trống nếu không đổi)' : '9 hoặc 12 chữ số'">
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">Số điện thoại *</label>
                <input type="tel" id="phone" name="phone" class="form-control" required pattern="0\d{9}"
                       th:value="${tenant != null} ? ${tenant.phone()}" placeholder="0901234567">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email <span th:if="${tenant == null}">*</span></label>
                <input type="email" id="email" name="email" class="form-control" th:required="${tenant == null}"
                       th:value="${tenant != null} ? ${tenant.email()}" placeholder="Email dùng để đăng nhập">
            </div>
            <div class="form-group">
                <label class="form-label" for="permanentAddress">Địa chỉ thường trú</label>
                <input type="text" id="permanentAddress" name="permanentAddress" class="form-control"
                       th:value="${tenant != null} ? ${tenant.permanentAddress()}">
            </div>
            <button type="submit" class="btn btn-primary" th:text="${tenant == null} ? 'Thêm người thuê' : 'Lưu thay đổi'">Lưu</button>
        </form>
        <form th:if="${tenant != null and tenant.userId() == null}"
              th:action="@{'/properties/' + ${property.id()} + '/tenants/' + ${tenant.id()} + '/link-account'}"
              method="post" style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color);">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2 style="font-size: 15px;">Tài khoản đăng nhập</h2>
            <p style="margin: 0 0 8px; font-size: 12px; color: var(--text-secondary);">
                Người thuê này chưa có tài khoản app. Gắn tài khoản TENANT đã có theo email, hoặc cấp tài khoản mới
                (mật khẩu tạm chỉ hiển thị một lần).
            </p>
            <label class="form-label" for="linkAccountEmail">Email</label>
            <input type="email" id="linkAccountEmail" name="email" class="form-control" required
                   th:value="${tenant.email()}" placeholder="tenant@example.com">
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;">
                <button type="submit" class="btn btn-secondary">Liên kết tài khoản có sẵn</button>
                <button type="submit" class="btn btn-primary"
                        th:formaction="@{'/properties/' + ${property.id()} + '/tenants/' + ${tenant.id()} + '/issue-account'}">Cấp tài khoản mới</button>
            </div>
        </form>
        <p th:if="${tenant != null and tenant.userId() != null}"
           style="margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 13px; color: var(--text-secondary);">
            Người thuê này đã có tài khoản app.
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:if="${tenant == null}">
<div th:replace="~{fragments/tenant-picker :: script}"></div>
<script>
    wireTenantPicker(document.querySelector('.tenant-picker'), {
        fields: {
            fullName: document.getElementById('fullName'),
            idCard: document.getElementById('identityCardNumber'),
            phone: document.getElementById('phone'),
            email: document.getElementById('email'),
            address: document.getElementById('permanentAddress')
        }
    });
</script>
</th:block>
</body>
</html>
