<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu')}"></head>
<body>
<main class="container" style="max-width: 460px; padding-top: 72px;">
    <div class="card">
        <h1 style="margin-bottom: 8px;">Quên mật khẩu</h1>
        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">
            Nhập tên đăng nhập hoặc địa chỉ email tài khoản của bạn để nhận hướng dẫn khôi phục mật khẩu.
        </p>

        <div th:if="${successMessage}" class="alert alert-success" style="display: flex; align-items: flex-start; gap: 8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <div th:utext="${successMessage}">Thông báo hướng dẫn</div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" style="display: flex; align-items: center; gap: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Thông báo lỗi</span>
        </div>

        <form th:if="${successMessage == null}" th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label" for="identifier">Tên đăng nhập hoặc Email *</label>
                <input id="identifier"
                       type="text"
                       name="identifier"
                       th:value="${identifier}"
                       class="form-control"
                       placeholder="Ví dụ: admin, staff1 hoặc user@example.com"
                       required
                       autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Gửi yêu cầu khôi phục</button>
        </form>

        <div style="margin-top: 20px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <a th:href="@{/login}" style="font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500;">
                &larr; Quay lại trang Đăng nhập
            </a>
        </div>
    </div>
</main>
</body>
</html>
