<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>
<main class="container" style="max-width: 460px; padding-top: 72px;">
    <div class="card">
        <h1 style="margin-bottom: 8px;">Đăng nhập PhongHub</h1>
        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">
            Sử dụng tên đăng nhập và mật khẩu do quản trị viên cấp.
        </p>

        <div th:if="${successMessage}" class="alert alert-success" style="display: flex; align-items: center; gap: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <span th:text="${successMessage}">Thông báo thành công</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error" style="display: flex; align-items: center; gap: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Thông tin đăng nhập không hợp lệ</span>
        </div>
        <div th:if="${suggestForgotPassword}" class="alert" style="display: flex; align-items: flex-start; gap: 10px; background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.35); color: #b45309; padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; line-height: 1.5;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <div>
                <span>Bạn đã nhập sai thông tin </span><strong th:text="${failedAttempts}">3</strong><span> lần liên tiếp. Nếu không nhớ mật khẩu, bạn có thể </span>
                <a th:href="@{/forgot-password}" style="color: #b45309; font-weight: 700; text-decoration: underline;">bấm vào đây để yêu cầu cấp lại mật khẩu</a>.
            </div>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input id="username" type="text" name="username" th:value="${username}" class="form-control" autocomplete="username" required th:autofocus="${errorMessage == null}">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required th:autofocus="${errorMessage != null}" style="padding-right: 40px;">
                    <button type="button" id="togglePasswordBtn" aria-label="Hiện mật khẩu" title="Hiện hoặc ẩn mật khẩu" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 4px; display: inline-flex; align-items: center; justify-content: center;">
                        <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng nhập</button>
            <div style="text-align: center; margin-top: 16px;">
                <a th:href="@{/forgot-password}" style="font-size: 13px; color: var(--accent); text-decoration: none;">Quên mật khẩu?</a>
            </div>
        </form>
    </div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eyeIconOpen');
        const eyeClosed = document.getElementById('eyeIconClosed');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function () {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleBtn.setAttribute('aria-label', isPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
                if (eyeOpen && eyeClosed) {
                    eyeOpen.style.display = isPassword ? 'none' : 'block';
                    eyeClosed.style.display = isPassword ? 'block' : 'none';
                }
            });
        }
    });
</script>
</body>
</html>
