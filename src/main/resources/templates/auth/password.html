<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body>
<header th:if="${currentUser != null and !currentUser.mustChangePassword()}" th:replace="~{fragments/layout :: header}"></header>

<main class="container" style="max-width: 520px; padding-top: 48px; padding-bottom: 48px;">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card">
        <h1 style="margin-bottom: 8px;">Đổi mật khẩu</h1>
        <p th:if="${currentUser != null and currentUser.mustChangePassword()}" style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">
            Tài khoản của bạn cần đổi mật khẩu trước khi sử dụng PhongHub.
        </p>
        <p th:if="${currentUser == null or !currentUser.mustChangePassword()}" style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">
            Nhập mật khẩu mới có độ dài tối thiểu 8 ký tự để cập nhật mật khẩu cho tài khoản của bạn.
        </p>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">Mật khẩu không hợp lệ</div>

        <form th:action="@{/account/password}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label" for="newPassword">Mật khẩu mới</label>
                <input id="newPassword" type="password" name="newPassword" class="form-control"
                       minlength="8" autocomplete="new-password" required autofocus
                       placeholder="Nhập tối thiểu 8 ký tự">
            </div>
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 20px;">
                <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
                <a th:if="${currentUser == null or !currentUser.mustChangePassword()}" th:href="@{/account/profile}" class="btn" style="text-decoration: none;">Quay lại</a>
            </div>
        </form>
    </div>
</main>

<footer th:if="${currentUser != null and !currentUser.mustChangePassword()}" th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
