<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đang chuyển đến SePay Sandbox')}"></head>
<body>
<main class="container" style="max-width: 640px; padding-top: 48px;">
    <div class="card" style="text-align: center;">
        <h1 style="font-size: 20px;">Đang chuyển đến SePay Sandbox</h1>
        <p>Đây là môi trường mô phỏng thanh toán, không trừ tiền thật.</p>
        <form id="sepay-checkout" method="post" th:attr="action=${checkoutAction}">
            <input th:each="field : ${checkoutFields}" type="hidden"
                   th:name="${field.key}" th:value="${field.value}">
            <button type="submit" class="btn btn-primary">Tiếp tục thanh toán</button>
        </form>
        <p style="font-size: 12px; color: var(--text-secondary); margin-top: 12px;">
            Nếu trình duyệt không tự chuyển trang, bấm nút để tiếp tục.
        </p>
    </div>
</main>
<script>
    window.addEventListener('load', function () {
        document.getElementById('sepay-checkout').submit();
    });
</script>
</body>
</html>
