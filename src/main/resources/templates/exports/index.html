<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Xuất dữ liệu')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-title-row">
        <div>
            <h1>Xuất dữ liệu</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Tải hóa đơn, công nợ hoặc hợp đồng trong phạm vi bạn được quản lý ra Excel hoặc PDF. Số CCCD luôn được che.</p>
        </div>
    </div>

    <div class="card">
        <form th:action="@{/exports/download}" method="get" id="exportForm"
              style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
            <div class="form-group" style="min-width: 180px; margin: 0;">
                <label class="form-label" for="dataset">Dữ liệu</label>
                <select id="dataset" name="dataset" class="form-control">
                    <!-- Quản trị viên không xem số liệu tiền nên chỉ xuất hợp đồng (#163) -->
                    <th:block th:unless="${currentUser != null and currentUser.role().name() == 'ADMIN'}">
                        <option value="invoices">Hóa đơn theo kỳ</option>
                        <option value="debts">Công nợ hiện tại</option>
                    </th:block>
                    <option value="contracts">Hợp đồng</option>
                </select>
            </div>
            <div class="form-group" style="min-width: 200px; margin: 0;">
                <label class="form-label" for="propertyId">Nhà trọ</label>
                <select id="propertyId" name="propertyId" class="form-control">
                    <option value="">Tất cả trong phạm vi</option>
                    <option th:each="p : ${properties}" th:value="${p.id()}" th:text="${p.name()}">Nhà trọ</option>
                </select>
            </div>
            <div class="form-group" style="margin: 0;">
                <label class="form-label" for="from">Từ tháng (hóa đơn)</label>
                <input id="from" type="month" name="from" class="form-control" th:value="${currentMonth.minusMonths(11)}">
            </div>
            <div class="form-group" style="margin: 0;">
                <label class="form-label" for="to">Đến tháng (hóa đơn)</label>
                <input id="to" type="month" name="to" class="form-control" th:value="${currentMonth}">
            </div>
            <div class="form-group" style="min-width: 120px; margin: 0;">
                <label class="form-label" for="format">Định dạng</label>
                <select id="format" name="format" class="form-control">
                    <option value="xlsx">Excel (.xlsx)</option>
                    <option value="pdf">PDF</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Tải xuống</button>
        </form>
        <p style="font-size: 12px; color: var(--text-secondary); margin-top: 12px;">
            Hóa đơn và công nợ cần quyền thu tiền; hợp đồng cần quyền quản lý hợp đồng tại nhà trọ.
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
