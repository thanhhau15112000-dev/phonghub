<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Bộ chọn ảnh/video có xem trước: thêm dần nhiều lần, bỏ từng tệp, chặn vượt giới hạn trước khi gửi.
     Máy chủ vẫn kiểm tra lại toàn bộ; phần này chỉ giúp người dùng thấy và sửa lựa chọn. -->
<div th:fragment="attachmentPicker(existingImages, existingVideos, requireFile)" class="attachment-picker"
     th:attr="data-existing-images=${existingImages},data-existing-videos=${existingVideos},data-require-file=${requireFile}">
    <input type="file" name="files" class="attachment-picker-input" multiple hidden
           accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime">
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <button type="button" class="btn btn-sm btn-secondary attachment-picker-add">+ Thêm ảnh/video</button>
        <span class="attachment-picker-count" style="font-size: 12px; color: var(--text-secondary);"></span>
    </div>
    <p class="attachment-picker-error" role="alert"
       style="display: none; margin: 8px 0 0; font-size: 12px; color: var(--danger-color, #dc2626);"></p>
    <div class="attachment-picker-list"
         style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px;"></div>
    <small style="display: block; margin-top: 6px; color: var(--text-secondary);">
        Tối đa 5 ảnh và 1 video mỗi phiếu; mỗi tệp tối đa 10 MB. Ảnh: JPEG, PNG, WebP. Video: MP4, WebM, MOV.
    </small>
    <script>
        (function (picker) {
            var MAX_IMAGES = 5, MAX_VIDEOS = 1, MAX_BYTES = 10 * 1024 * 1024;
            var IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
            var VIDEO_TYPES = ['video/mp4', 'video/webm', 'video/quicktime'];
            var existingImages = Number(picker.dataset.existingImages) || 0;
            var existingVideos = Number(picker.dataset.existingVideos) || 0;
            var input = picker.querySelector('.attachment-picker-input');
            var addButton = picker.querySelector('.attachment-picker-add');
            var list = picker.querySelector('.attachment-picker-list');
            var count = picker.querySelector('.attachment-picker-count');
            var error = picker.querySelector('.attachment-picker-error');
            var form = picker.closest('form');
            var selected = [];

            function isVideo(file) { return VIDEO_TYPES.indexOf(file.type) >= 0; }
            function imagesUsed() { return existingImages + selected.filter(function (s) { return !isVideo(s.file); }).length; }
            function videosUsed() { return existingVideos + selected.filter(function (s) { return isVideo(s.file); }).length; }
            function sizeLabel(bytes) {
                return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
            }
            function showError(message) {
                error.textContent = message;
                error.style.display = message ? 'block' : 'none';
            }

            function render() {
                list.innerHTML = '';
                selected.forEach(function (entry, index) {
                    var item = document.createElement('div');
                    item.className = 'attachment-picker-item';
                    item.style.cssText = 'position: relative; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; min-width: 0;';
                    var media = document.createElement(isVideo(entry.file) ? 'video' : 'img');
                    media.src = entry.url;
                    media.style.cssText = 'display: block; width: 100%; height: 90px; object-fit: cover; border-radius: 4px; background: #111;';
                    if (isVideo(entry.file)) {
                        media.controls = true;
                        media.preload = 'metadata';
                    } else {
                        media.alt = entry.file.name;
                    }
                    var name = document.createElement('small');
                    name.textContent = entry.file.name + ' · ' + sizeLabel(entry.file.size);
                    name.title = entry.file.name;
                    name.style.cssText = 'display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary);';
                    var remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'btn btn-sm btn-danger attachment-picker-remove';
                    remove.textContent = '✕';
                    remove.setAttribute('aria-label', 'Bỏ ' + entry.file.name);
                    remove.style.cssText = 'position: absolute; top: 4px; right: 4px; height: 24px; padding: 0 7px;';
                    remove.addEventListener('click', function () {
                        URL.revokeObjectURL(entry.url);
                        selected.splice(index, 1);
                        showError('');
                        sync();
                    });
                    item.append(media, name, remove);
                    list.appendChild(item);
                });
            }

            // Danh sách đã chọn là nguồn sự thật; ô input chỉ phản chiếu lại để form gửi đúng các tệp này
            function sync() {
                var transfer = new DataTransfer();
                selected.forEach(function (entry) { transfer.items.add(entry.file); });
                input.files = transfer.files;
                count.textContent = 'Ảnh: ' + imagesUsed() + '/' + MAX_IMAGES + ' · Video: ' + videosUsed() + '/' + MAX_VIDEOS;
                addButton.disabled = imagesUsed() >= MAX_IMAGES && videosUsed() >= MAX_VIDEOS;
                // Nút gửi nằm sau bộ chọn trong form nên phải tìm lại mỗi lần, không lấy lúc script vừa chạy
                var submit = form ? form.querySelector('[type="submit"]') : null;
                if (submit && picker.dataset.requireFile === 'true') {
                    submit.disabled = selected.length === 0;
                }
                render();
            }

            addButton.addEventListener('click', function () { input.click(); });
            input.addEventListener('change', function () {
                var picked = Array.prototype.slice.call(input.files);
                var problems = [];
                picked.forEach(function (file) {
                    var video = isVideo(file);
                    if (!video && IMAGE_TYPES.indexOf(file.type) < 0) {
                        problems.push(file.name + ' (định dạng không hỗ trợ)');
                    } else if (file.size > MAX_BYTES) {
                        problems.push(file.name + ' (lớn hơn 10 MB)');
                    } else if (selected.some(function (s) {
                        return s.file.name === file.name && s.file.size === file.size && s.file.lastModified === file.lastModified;
                    })) {
                        problems.push(file.name + ' (đã có trong danh sách)');
                    } else if (video ? videosUsed() >= MAX_VIDEOS : imagesUsed() >= MAX_IMAGES) {
                        problems.push(file.name + (video ? ' (đã đủ 1 video)' : ' (đã đủ 5 ảnh)'));
                    } else {
                        selected.push({ file: file, url: URL.createObjectURL(file) });
                    }
                });
                showError(problems.length ? 'Không thêm được: ' + problems.join(', ') + '.' : '');
                sync();
            });
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', sync);
            } else {
                sync();
            }
        })(document.currentScript.parentElement);
    </script>
</div>
</body>
</html>
