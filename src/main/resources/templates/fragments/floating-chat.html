<div th:fragment="floatingChatWidget" th:if="${currentUser != null}" id="phonghubFloatingChatContainer"
     th:data-user-id="${currentUser.id()}" th:data-user-name="${currentUser.fullName()}">
    <style>
        /* Tương tác mượt mà cho các phần tử chat PhongHub (Theme: Trắng viền xám) */
        #phonghubMessengerToggleBtn:hover {
            background-color: #f8fafc !important;
            border-color: #94a3b8 !important;
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.18) !important;
        }
        #phonghubMessengerToggleBtn:active {
            transform: scale(0.96);
        }
        .phonghub-contact-item {
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .phonghub-contact-item:hover {
            background-color: #f1f5f9 !important;
        }
        .phonghub-contact-item:active {
            transform: scale(0.99);
        }
        .phonghub-chat-head {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 2px solid #ffffff;
        }
        .phonghub-chat-head:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
        }
        .phonghub-chat-head .chat-head-close-btn {
            display: none;
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .phonghub-chat-head:hover .chat-head-close-btn {
            display: flex;
        }
        .phonghub-chat-head .chat-head-close-btn:hover {
            background-color: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
        }
        .phonghub-chat-head .chat-head-tooltip {
            display: none;
            position: absolute;
            right: 58px;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
            pointer-events: none;
            border: 1px solid #cbd5e1;
        }
        .phonghub-chat-head:hover .chat-head-tooltip {
            display: block;
        }
        .phonghub-icon-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
        }
        .phonghub-icon-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .phonghub-icon-btn:active {
            transform: scale(0.92);
        }
        #phonghubContactFilterInput::placeholder,
        #phonghubDockedInput::placeholder {
            color: #94a3b8;
        }
        #phonghubDockedSubmitBtn:hover {
            transform: scale(1.15);
        }
        #phonghubContactsList::-webkit-scrollbar,
        #phonghubDockedMessagesPane::-webkit-scrollbar {
            width: 6px;
        }
        #phonghubContactsList::-webkit-scrollbar-thumb,
        #phonghubDockedMessagesPane::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }
        #phonghubContactsList::-webkit-scrollbar-track,
        #phonghubDockedMessagesPane::-webkit-scrollbar-track {
            background: transparent;
        }
        @keyframes phonghubToastSlideIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .phonghub-chat-toast {
            animation: phonghubToastSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            transition: transform 0.2s ease, opacity 0.25s ease, box-shadow 0.2s ease;
        }
        .phonghub-chat-toast:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.2) !important;
        }
    </style>

    <!-- Cột bên phải (right: 20px) dành cho các nút tròn: Dưới cùng là nút Soạn tin nhắn, phía trên là các Avatar chat thu nhỏ -->
    
    <!-- 1. Danh sách các nút tròn Avatar thu nhỏ (Chat Heads) xếp ở phía TRÊN nút soạn tin nhắn -->
    <div id="phonghubChatHeadsContainer" style="position: fixed; bottom: 76px; right: 20px; display: flex; flex-direction: column-reverse; gap: 8px; z-index: 99999;">
        <!-- Các avatar tròn thu nhỏ sẽ được thêm động vào đây bằng JavaScript -->
    </div>

    <!-- 2. Nút bấm tròn Soạn tin nhắn ở góc dưới cùng bên phải: Theme màu trắng viền xám đồng nhất -->
    <button type="button" id="phonghubMessengerToggleBtn" aria-label="Soạn tin nhắn" title="Soạn tin nhắn mới"
            style="position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background-color: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.14); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 99999; transition: background-color 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;">
        <!-- Icon Soạn tin nhắn chuẩn Messenger -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="display: block;">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="#1e293b" stroke-width="2.2"/>
            <path d="M8.5 15.5L14.5 9.5" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="15.5" cy="8.5" r="1.3" fill="#1e293b"/>
        </svg>
        <!-- Huy hiệu số tin nhắn chưa đọc toàn cục -->
        <span id="phonghubGlobalUnreadBadge" style="display: none; position: absolute; top: -3px; right: -3px; background-color: #ef4444; color: #ffffff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 5px; min-width: 16px; text-align: center; border: 2px solid #ffffff; line-height: 1.2;">0</span>
    </button>

    <!-- 3. Modal "Tin nhắn mới / Chọn kênh chat" - Cố định sát mép dưới (bottom: 0, không cách ra) -->
    <div id="phonghubNewMessageModal" style="display: none; position: fixed; bottom: 0; right: 86px; width: 348px; height: 465px; background-color: #ffffff; color: #0f172a; border-radius: 12px 12px 0 0; box-shadow: 0 12px 36px rgba(15, 23, 42, 0.16), 0 2px 10px rgba(15, 23, 42, 0.08); border: 1px solid #cbd5e1; border-bottom: none; z-index: 100000; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: right 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;">
        <!-- Header: Tiêu đề + Nút đóng X -->
        <div style="padding: 12px 16px 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; background-color: #ffffff;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-weight: 700; font-size: 15.5px; color: #0f172a; letter-spacing: -0.2px;">Tin nhắn & Kênh chat</span>
            </div>
            <button type="button" id="phonghubCloseNewMessageBtn" class="phonghub-icon-btn" aria-label="Đóng" style="font-size: 17px; font-weight: 700;">✕</button>
        </div>

        <!-- Hàng tìm kiếm kênh / người dùng dạng thanh pill bo tròn sáng sủa -->
        <div style="padding: 10px 14px 8px 14px; border-bottom: 1px solid #f1f5f9; background-color: #ffffff;">
            <div style="display: flex; align-items: center; background-color: #f1f5f9; border-radius: 20px; padding: 6px 14px; gap: 8px; border: 1px solid #e2e8f0;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="phonghubContactFilterInput" placeholder="Tìm người dùng hoặc kênh chat..." autocomplete="off"
                       style="flex: 1; background: transparent; border: none; outline: none; color: #0f172a; font-size: 13px;">
            </div>
        </div>

        <!-- Danh sách các kênh chat và người dùng (Giao diện kênh chat trực quan, chuyên nghiệp) -->
        <div id="phonghubContactsList" style="flex: 1; overflow-y: auto; padding: 8px 10px; background-color: #ffffff;">
            <div style="padding: 24px; text-align: center; color: #64748b; font-size: 13px;">Đang tải danh sách...</div>
        </div>
    </div>

    <!-- 4. Khung chat Messenger docked - Theme Màu trắng viền xám đồng nhất với PhongHub -->
    <div id="phonghubDockedMessengerBox" style="display: none; position: fixed; bottom: 0; right: 86px; width: 348px; height: 465px; background-color: #ffffff; color: #0f172a; border-radius: 12px 12px 0 0; box-shadow: 0 12px 36px rgba(15, 23, 42, 0.16), 0 2px 10px rgba(15, 23, 42, 0.08); border: 1px solid #cbd5e1; border-bottom: none; z-index: 100001; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: right 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;">
        <!-- Header khung chat: Nền trắng, viền xám, hiển thị rõ ràng -->
        <div id="phonghubDockedHeader" style="padding: 10px 14px; background-color: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; user-select: none;">
            <!-- Thông tin người đang chat: Gọn gàng, chỉ Avatar và Tên -->
            <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                <div id="phonghubDockedAvatar" style="width: 36px; height: 36px; border-radius: 50%; background: #e2e8f0; color: #0f172a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; overflow: hidden; border: 1.5px solid #cbd5e1; flex-shrink: 0;">
                    U
                </div>
                <div style="min-width: 0; display: flex; flex-direction: column;">
                    <span id="phonghubDockedTitle" style="font-weight: 700; font-size: 14px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; letter-spacing: -0.1px;">Người dùng</span>
                    <span id="phonghubDockedStatus" style="display: none; font-size: 11px; color: #64748b; line-height: 1.2;"></span>
                </div>
            </div>

            <!-- Các nút điều khiển: Thu nhỏ '-' và Đóng 'X' -->
            <div style="display: flex; align-items: center; gap: 4px;">
                <!-- Nút thu nhỏ '-' -->
                <button type="button" id="phonghubDockedMinimizeBtn" class="phonghub-icon-btn" title="Thu nhỏ cuộc trò chuyện">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="4" y="11" width="16" height="2.5" rx="1"/>
                    </svg>
                </button>
                <!-- Nút đóng 'X' -->
                <button type="button" id="phonghubDockedCloseBtn" class="phonghub-icon-btn" title="Đóng cuộc trò chuyện" style="font-size: 17px; font-weight: 700; line-height: 1;">
                    ✕
                </button>
            </div>
        </div>

        <!-- Khung hiển thị các tin nhắn trò chuyện (Nền xám nhạt dịu mắt chuẩn PhongHub) -->
        <div id="phonghubDockedMessagesPane" style="flex: 1; padding: 12px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-color: #f8fafc;">
            <div style="margin: auto; color: #64748b; font-size: 12.5px;">Đang tải tin nhắn...</div>
        </div>

        <!-- Khung nhập văn bản bên dưới: Nền trắng, ô nhập xám nhạt có viền -->
        <div id="phonghubDockedFooter" style="padding: 8px 10px; background-color: #ffffff; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 4px;">
            <form id="phonghubDockedSendForm" style="width: 100%; display: flex; align-items: center; margin: 0; gap: 6px;">
                <input type="text" id="phonghubDockedInput" placeholder="Aa" autocomplete="off"
                       style="flex: 1; background-color: #f1f5f9; color: #0f172a; border-radius: 20px; border: 1px solid #cbd5e1; padding: 7px 12px; font-size: 13.5px; outline: none; transition: border-color 0.15s ease;">
                <!-- Nút Thích hoặc Nút Gửi -->
                <button type="submit" id="phonghubDockedSubmitBtn" title="Gửi" style="background: none; border: none; color: #0084ff; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease; flex-shrink: 0;">
                    <span id="phonghubSendIconLike" style="display: flex;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
                        </svg>
                    </span>
                    <span id="phonghubSendIconFly" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <!-- Script điều khiển toàn bộ Chat & Minimized Chat Heads -->
    <script>
    (function() {
        let currentUserId = '';
        let activeFloatingRoomId = null;
        let activeRecipientName = '';
        let activeRecipientAvatar = '';
        let activeRoomType = 'DIRECT';
        let cachedContacts = [];
        let cachedRooms = [];

        // Danh sách các phòng chat đang được thu nhỏ (Chat Heads)
        let minimizedChatList = [];

        function updateWindowsLayout() {
            const dockedBox = document.getElementById('phonghubDockedMessengerBox');
            const newMsgModal = document.getElementById('phonghubNewMessageModal');
            const toastContainer = document.getElementById('phonghubChatToastContainer');
            if (!dockedBox || !newMsgModal) return;

            const isDockedOpen = dockedBox.style.display === 'flex';
            const isModalOpen = newMsgModal.style.display === 'flex';

            dockedBox.style.right = '86px';

            if (isDockedOpen && isModalOpen) {
                if (window.innerWidth >= 820) {
                    // Cả 2 cùng mở trên màn hình rộng: Xếp kề sang bên trái khung chat (cách 12px), tuyệt đối không bị đè lên nhau
                    newMsgModal.style.right = '446px';
                } else {
                    // Màn hình hẹp: Không đủ chỗ cho 2 cửa sổ -> Tự động đóng modal chọn người để ưu tiên khung chat
                    newMsgModal.style.display = 'none';
                    newMsgModal.style.right = '86px';
                }
            } else {
                newMsgModal.style.right = '86px';
            }

            if (toastContainer) {
                if (isDockedOpen && isModalOpen && window.innerWidth >= 1200) {
                    toastContainer.style.right = '806px';
                } else if (isDockedOpen || isModalOpen) {
                    toastContainer.style.right = '446px';
                } else {
                    toastContainer.style.right = '86px';
                }
            }
        }

        function startWidget() {
            const container = document.getElementById('phonghubFloatingChatContainer');
            if (!container) return;
            currentUserId = container.dataset.userId || '';
            if (!currentUserId) return;

            const toggleBtn = document.getElementById('phonghubMessengerToggleBtn');
            const newMsgModal = document.getElementById('phonghubNewMessageModal');
            const closeNewMsgBtn = document.getElementById('phonghubCloseNewMessageBtn');
            const contactFilterInput = document.getElementById('phonghubContactFilterInput');
            
            const dockedBox = document.getElementById('phonghubDockedMessengerBox');
            const dockedCloseBtn = document.getElementById('phonghubDockedCloseBtn');
            const dockedMinimizeBtn = document.getElementById('phonghubDockedMinimizeBtn');
            const dockedSendForm = document.getElementById('phonghubDockedSendForm');
            const dockedInput = document.getElementById('phonghubDockedInput');
            const iconLike = document.getElementById('phonghubSendIconLike');
            const iconFly = document.getElementById('phonghubSendIconFly');

            // Chuyển đổi icon Thích 👍 sang icon Gửi ✈️ khi người dùng gõ văn bản
            if (dockedInput) {
                dockedInput.addEventListener('input', () => {
                    const hasText = dockedInput.value.trim().length > 0;
                    if (iconLike && iconFly) {
                        iconLike.style.display = hasText ? 'none' : 'flex';
                        iconFly.style.display = hasText ? 'flex' : 'none';
                    }
                });
            }

            // Bấm nút tròn Soạn tin nhắn -> Bật/tắt modal "Tin nhắn mới" ở BÊN TRÁI nút
            if (toggleBtn) {
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isHidden = newMsgModal.style.display === 'none' || newMsgModal.style.display === '';
                    if (isHidden) {
                        newMsgModal.style.display = 'flex';
                        updateWindowsLayout();
                        loadAndRenderContacts();
                        if (contactFilterInput) {
                            contactFilterInput.value = '';
                            setTimeout(() => contactFilterInput.focus(), 60);
                        }
                    } else {
                        newMsgModal.style.display = 'none';
                        updateWindowsLayout();
                    }
                });
            }

            // Đóng modal "Tin nhắn mới"
            if (closeNewMsgBtn) {
                closeNewMsgBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    newMsgModal.style.display = 'none';
                    updateWindowsLayout();
                });
            }

            // Đóng modal khi bấm ra ngoài trang (không tự đóng khi người dùng đang bấm trong khung chat hoặc chat heads)
            document.addEventListener('click', (e) => {
                if (newMsgModal && newMsgModal.style.display === 'flex' &&
                    !newMsgModal.contains(e.target) &&
                    toggleBtn && !toggleBtn.contains(e.target) &&
                    dockedBox && !dockedBox.contains(e.target) &&
                    !e.target.closest('.phonghub-chat-head')) {
                    newMsgModal.style.display = 'none';
                    updateWindowsLayout();
                }
            });

            window.addEventListener('resize', updateWindowsLayout);

            // Tìm kiếm/lọc người dùng trong ô tìm kiếm
            if (contactFilterInput) {
                contactFilterInput.addEventListener('input', (e) => {
                    const keyword = e.target.value.toLowerCase().trim();
                    filterAndRenderContacts(keyword);
                });
            }

            // Đóng khung chat docked hoàn toàn (nút 'X')
            if (dockedCloseBtn) {
                dockedCloseBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeChatHead(activeFloatingRoomId);
                    activeFloatingRoomId = null;
                    dockedBox.style.display = 'none';
                    updateWindowsLayout();
                });
            }

            // Thu nhỏ khung chat (nút '-') -> Biến thành nút tròn avatar ở TRÊN nút soạn tin nhắn
            if (dockedMinimizeBtn) {
                dockedMinimizeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    minimizeActiveChat();
                    updateWindowsLayout();
                });
            }

            // Gửi tin nhắn khi nhấn Enter hoặc bấm nút Gửi/Thích
            if (dockedSendForm) {
                dockedSendForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!activeFloatingRoomId) return;

                    let content = dockedInput.value.trim();
                    if (!content) {
                        content = '👍';
                    }
                    dockedInput.value = '';
                    if (iconLike && iconFly) {
                        iconLike.style.display = 'flex';
                        iconFly.style.display = 'none';
                    }
                    await postMessage(content);
                });
            }

            async function postMessage(content) {
                try {
                    const res = await fetch(`/api/chat/rooms/${activeFloatingRoomId}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content })
                    });
                    if (res.ok) {
                        const saved = await res.json();
                        appendDockedMessageUI(saved);
                    }
                } catch (err) {
                    console.error('Lỗi khi gửi tin nhắn:', err);
                }
            }

            refreshUnreadBadge();
            initGlobalSse();
        }

        // Chức năng thu nhỏ chat thành nút tròn Avatar (Chat Head) ở cột bên phải
        function minimizeActiveChat() {
            if (!activeFloatingRoomId) return;
            const dockedBox = document.getElementById('phonghubDockedMessengerBox');
            dockedBox.style.display = 'none';
            updateWindowsLayout();

            const exists = minimizedChatList.some(c => c.roomId === activeFloatingRoomId);
            if (!exists) {
                minimizedChatList.push({
                    roomId: activeFloatingRoomId,
                    name: activeRecipientName,
                    avatar: activeRecipientAvatar,
                    type: activeRoomType
                });
            }
            activeFloatingRoomId = null;
            renderChatHeads();
        }

        // Render các nút tròn Avatar ở trên nút soạn tin nhắn
        function renderChatHeads() {
            const headsContainer = document.getElementById('phonghubChatHeadsContainer');
            headsContainer.innerHTML = '';

            minimizedChatList.forEach(chat => {
                const headDiv = document.createElement('div');
                headDiv.className = 'phonghub-chat-head';

                const avatarColor = chat.type === 'GLOBAL' ? 'linear-gradient(135deg, #0084ff, #4f46e5)' : getAvatarColor(chat.name);
                headDiv.style.background = avatarColor;
                headDiv.style.color = '#ffffff';
                headDiv.style.fontWeight = '700';
                headDiv.style.fontSize = '15px';

                headDiv.innerHTML = `
                    <span>${chat.type === 'GLOBAL' ? '🌐' : (chat.avatar || 'U')}</span>
                    <!-- Tooltip tên người chat khi rê chuột -->
                    <div class="chat-head-tooltip">${escapeHtml(chat.name)}</div>
                    <!-- Nút X nhỏ để đóng hẳn chat head -->

                const closeBtn = headDiv.querySelector('.chat-head-close-btn');

                    openDockedChat(chat.roomId, chat.name, chat.avatar, chat.type);
                });

                headsContainer.appendChild(headDiv);
            });
        }

            minimizedChatList = minimizedChatList.filter(c => c.roomId !== roomId);

        // Phát âm thanh thông báo nhẹ nhàng khi có tin nhắn mới gửi đến
        function playMessageNotificationSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch (e) {}
        }

        function formatChatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return '';
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            if (isToday) {
                return `${hours}:${minutes}`;
            }
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            return `${day}/${month}`;
        }

        // Tải và hiển thị danh sách người dùng trong popup
        async function loadAndRenderContacts() {
            const container = document.getElementById('phonghubContactsList');
            try {
                const [contactsRes, roomsRes] = await Promise.all([
                    fetch('/api/chat/contacts'),
                    fetch('/api/chat/rooms')
                ]);

                if (contactsRes.ok) cachedContacts = await contactsRes.json();
                if (roomsRes.ok) cachedRooms = await roomsRes.json();

                const filterInput = document.getElementById('phonghubContactFilterInput');
                const keyword = filterInput ? filterInput.value.toLowerCase().trim() : '';
                filterAndRenderContacts(keyword);
            } catch (err) {
                console.error('Lỗi khi tải danh sách người dùng:', err);
                if (container) container.innerHTML = '<div style="padding: 24px; text-align: center; color: #ef4444; font-size: 13px;">Không thể tải danh sách tài khoản.</div>';
            }
        }

        // Lấy thông tin vai trò: Nhãn rõ ràng, badge màu pastel tinh tế trên nền trắng
        function getRoleInfo(role) {
            switch (role) {
                case 'ADMIN':
                    return { label: 'Quản trị viên', bg: '#f3e8ff', color: '#7e22ce' };
                case 'OWNER':
                    return { label: 'Chủ trọ', bg: '#dcfce7', color: '#15803d' };
                case 'STAFF':
                    return { label: 'Nhân viên', bg: '#dbeafe', color: '#1d4ed8' };
                case 'TECHNICIAN':
                    return { label: 'Kỹ thuật viên', bg: '#fef3c7', color: '#b45309' };
                case 'TENANT':
                    return { label: 'Người dùng', bg: '#f1f5f9', color: '#475569' };
                default:
                    return { label: 'Người dùng', bg: '#f1f5f9', color: '#475569' };
            }
        }

        function filterAndRenderContacts(keyword) {
            const container = document.getElementById('phonghubContactsList');
            if (!container) return;
            container.innerHTML = '';

            const globalRoom = cachedRooms.find(r => r.type === 'GLOBAL');
            const globalUnread = globalRoom ? (globalRoom.unreadCount || 0) : 0;
            let globalSubtitle = 'Kênh thông báo & trao đổi toàn hệ thống';
            let globalTime = '';
            if (globalUnread > 0 && globalRoom && globalRoom.lastMessageContent) {
                const senderPrefix = globalRoom.lastMessageSenderName ? globalRoom.lastMessageSenderName + ': ' : '';
                globalSubtitle = senderPrefix + globalRoom.lastMessageContent;
                globalTime = formatChatTime(globalRoom.lastMessageAt);
            } else if (globalRoom && globalRoom.lastMessageAt) {
                globalTime = formatChatTime(globalRoom.lastMessageAt);
            }

            // 1. Mục Kênh Chat Chung (Pinned Channel)
            if (!keyword || 'kênh chung ban quản lý meta ai'.includes(keyword)) {
                const globalItem = createChannelItemElement({
                    title: 'Kênh Chung Ban Quản Lý',
                    subtitle: globalSubtitle,
                    badgeHtml: '<span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background-color: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; white-space: nowrap;">Kênh chung</span>',
                    isSpecial: true,
                    isUnread: globalUnread > 0,
                    unreadCount: globalUnread,
                    timeText: globalTime,
                    avatarHtml: '<div style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #0084ff, #4f46e5); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,132,255,0.25);">🌐</div>',
                    onClick: async () => {
                        document.getElementById('phonghubNewMessageModal').style.display = 'none';
                        updateWindowsLayout();

                        // Xóa chấm đỏ Kênh chung ngay lập tức
                        if (globalRoom) {
                            globalRoom.unreadCount = 0;
                        }
                        updateGlobalBadgeCount();
                        const filterInput = document.getElementById('phonghubContactFilterInput');
                        filterAndRenderContacts(filterInput ? filterInput.value.toLowerCase().trim() : '');

                        let targetRoom = cachedRooms.find(r => r.type === 'GLOBAL');
                        if (!targetRoom) {
                            const roomsRes = await fetch('/api/chat/rooms');
                            if (roomsRes.ok) {
                                cachedRooms = await roomsRes.json();
                                targetRoom = cachedRooms.find(r => r.type === 'GLOBAL');
                            }
                        }
                        if (targetRoom) {
                            removeChatHead(targetRoom.id);
                            openDockedChat(targetRoom.id, 'Kênh Chung Ban Quản Lý', '🌐', 'GLOBAL');
                        }
                    }
                });
                container.appendChild(globalItem);

                // Dòng phân cách nhóm kênh chat và người dùng
                const divider = document.createElement('div');
                divider.style.display = 'flex';
                divider.style.alignItems = 'center';
                divider.style.margin = '10px 4px 6px 4px';
                divider.style.fontSize = '11px';
                divider.style.fontWeight = '700';
                divider.style.color = '#94a3b8';
                divider.style.letterSpacing = '0.5px';
                divider.textContent = 'TRÒ CHUYỆN TRỰC TIẾP';
                container.appendChild(divider);
            }

            // 2. Danh sách các tài khoản người dùng kết hợp phòng chat
            const contactListWithRooms = cachedContacts.map(c => {
                const room = cachedRooms.find(r => r.type === 'DIRECT' && r.peerUserId === c.userId);
                return {
                    ...c,
                    roomId: room ? room.id : null,
                    unreadCount: room ? (room.unreadCount || 0) : 0,
                    lastMessageContent: room ? (room.lastMessageContent || '') : '',
                    lastMessageSenderName: room ? (room.lastMessageSenderName || '') : '',
                    lastMessageAt: room && room.lastMessageAt ? new Date(room.lastMessageAt).getTime() : 0
                };
            });

            const filtered = contactListWithRooms.filter(c => {
                if (!keyword) return true;
                const full = (c.fullName || '').toLowerCase();
                const roleInfo = getRoleInfo(c.role);
                const lastMsg = (c.lastMessageContent || '').toLowerCase();
                return full.includes(keyword) || roleInfo.label.toLowerCase().includes(keyword) || lastMsg.includes(keyword);
            });

            if (filtered.length === 0 && keyword) {
                const noMatch = document.createElement('div');
                noMatch.style.padding = '24px';
                noMatch.style.textAlign = 'center';
                noMatch.style.color = '#64748b';
                noMatch.style.fontSize = '13px';
                noMatch.textContent = 'Không tìm thấy người dùng phù hợp.';
                container.appendChild(noMatch);
                return;
            }

            // SẮP XẾP ƯU TIÊN:
            // 1. Có tin nhắn chưa đọc lên ĐẦU TIÊN (unreadCount > 0)
            // 2. Có tin nhắn gần đây nhất lên TIẾP THEO (thời gian mới nhất giảm dần)
            // 3. Cuối cùng là các tài khoản chưa trò chuyện
            filtered.sort((a, b) => {
                if (a.unreadCount > 0 && b.unreadCount === 0) return -1;
                if (b.unreadCount > 0 && a.unreadCount === 0) return 1;
                if (a.lastMessageAt !== b.lastMessageAt) {
                    return b.lastMessageAt - a.lastMessageAt;
                }
                return (a.fullName || '').localeCompare(b.fullName || '');
            });

            filtered.forEach(c => {
                const roleInfo = getRoleInfo(c.role);
                const initial = c.fullName ? c.fullName.trim().charAt(c.fullName.trim().lastIndexOf(' ') + 1) || c.fullName.charAt(0) : 'U';
                const avatarColor = getAvatarColor(c.fullName || c.userId);
                const isUnread = c.unreadCount > 0;

                // LOGIC CHUẨN:
                // - Khi CÓ tin chưa đọc: Dòng phụ hiện trích đoạn tin nhắn mới màu xanh
                // - Khi ĐÃ ĐỌC (hoặc chưa nhắn): Dòng phụ hiện vai trò sạch sẽ, KHÔNG hiện tin nhắn cũ
                let subtitle = roleInfo.label;
                let timeText = '';
                if (isUnread && c.lastMessageContent) {
                    subtitle = c.lastMessageContent;
                    timeText = formatChatTime(c.lastMessageAt);
                } else if (c.lastMessageAt) {
                    timeText = formatChatTime(c.lastMessageAt);
                }

                const item = createChannelItemElement({
                    title: c.fullName,
                    subtitle: subtitle,
                    timeText: timeText,
                    isUnread: isUnread,
                    unreadCount: c.unreadCount,
                    badgeHtml: `<span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background-color: ${roleInfo.bg}; color: ${roleInfo.color}; white-space: nowrap;">${roleInfo.label}</span>`,
                    isSpecial: false,
                    avatarHtml: `
                        <div style="width: 40px; height: 40px; border-radius: 50%; background-color: ${avatarColor}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex-shrink: 0;">${initial}</div>
                    `,
                    onClick: async () => {
                        document.getElementById('phonghubNewMessageModal').style.display = 'none';
                        updateWindowsLayout();

                        // XÓA CHẤM ĐỎ NGAY KHI BẤM XEM
                        c.unreadCount = 0;
                        if (c.roomId) {
                            const room = cachedRooms.find(r => String(r.id).toLowerCase() === String(c.roomId).toLowerCase());
                            if (room) room.unreadCount = 0;
                        }
                        updateGlobalBadgeCount();
                        const filterInput = document.getElementById('phonghubContactFilterInput');
                        filterAndRenderContacts(filterInput ? filterInput.value.toLowerCase().trim() : '');

                        if (c.roomId) {
                            removeChatHead(c.roomId);
                            openDockedChat(c.roomId, c.fullName, initial, 'DIRECT');
                        } else {
                            try {
                                const res = await fetch('/api/chat/rooms/direct', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ targetUserId: c.userId })
                                });
                                if (res.ok) {
                                    const room = await res.json();
                                    removeChatHead(room.id);
                                    openDockedChat(room.id, c.fullName, initial, 'DIRECT');
                                }
                            } catch (err) {
                                console.error('Lỗi khi mở cuộc trò chuyện trực tiếp:', err);
                            }
                        }
                    }
                });
                container.appendChild(item);
            });
        }

        // Mở khung chat docked Messenger (Theme Màu trắng viền xám)
        window.openDockedChat = async function(roomId, recipientName, recipientAvatar, roomType) {
            activeFloatingRoomId = roomId;
            activeRecipientName = recipientName;
            activeRecipientAvatar = recipientAvatar;
            activeRoomType = roomType || 'DIRECT';

            // XÓA CHẤM ĐỎ NGAY KHI MỞ CHAT
            const targetRoomCache = cachedRooms.find(r => String(r.id).toLowerCase() === String(roomId).toLowerCase());
            if (targetRoomCache) {
                targetRoomCache.unreadCount = 0;
            }
            updateGlobalBadgeCount();
            const filterInput = document.getElementById('phonghubContactFilterInput');
            filterAndRenderContacts(filterInput ? filterInput.value.toLowerCase().trim() : '');

            const dockedBox = document.getElementById('phonghubDockedMessengerBox');
            dockedBox.style.display = 'flex';
            updateWindowsLayout();

            document.getElementById('phonghubDockedTitle').textContent = recipientName;
            const statusElem = document.getElementById('phonghubDockedStatus');
            if (statusElem) {
                if (roomType === 'GLOBAL') {
                    statusElem.textContent = 'Kênh thông báo & trao đổi toàn hệ thống';
                    statusElem.style.display = 'block';
                } else {
                    statusElem.textContent = '';
                    statusElem.style.display = 'none';
                }
            }

            const avatarElem = document.getElementById('phonghubDockedAvatar');
            if (roomType === 'GLOBAL') {
                avatarElem.style.background = 'linear-gradient(135deg, #0084ff, #4f46e5)';
                avatarElem.style.color = '#ffffff';
                avatarElem.textContent = '🌐';
            } else {
                avatarElem.style.background = getAvatarColor(recipientName);
                avatarElem.style.color = '#ffffff';
                avatarElem.textContent = recipientAvatar || 'U';
            }

            const messagesPane = document.getElementById('phonghubDockedMessagesPane');
            messagesPane.innerHTML = '<div style="margin: auto; color: #64748b; font-size: 12.5px;">Đang tải tin nhắn...</div>';

            try {
                const res = await fetch(`/api/chat/rooms/${roomId}/messages`);
                if (res.ok) {
                    const peerLastReadHeader = res.headers.get('X-Peer-Last-Read-At');
                    const messages = await res.json();
                    messagesPane.innerHTML = '';
                    if (messages.length === 0) {
                        messagesPane.innerHTML = '<div class="phonghub-chat-empty" style="margin: auto; color: #64748b; font-size: 12.5px; text-align: center;">Chưa có tin nhắn nào.<br>Hãy gửi lời chào đầu tiên! 👋</div>';
                    } else {
                        messages.forEach(m => appendDockedMessageUI(m));
                    }
                    if (peerLastReadHeader) {
                        updateSeenStatusUI(peerLastReadHeader);
                    }
                    scrollMessagesToBottom();
                    fetch(`/api/chat/rooms/${roomId}/read`, { method: 'POST' }).then(() => {
                        refreshUnreadBadge();
                        loadAndRenderContacts();
                    });
                }
            } catch (err) {
                console.error('Lỗi khi tải tin nhắn phòng chat:', err);
            }
        };

        function appendDockedMessageUI(msg) {
            const pane = document.getElementById('phonghubDockedMessagesPane');
            if (document.getElementById(`docked-msg-${msg.id}`)) return;
            const emptyNotice = pane.querySelector('.phonghub-chat-empty');
            if (emptyNotice) emptyNotice.remove();

            const isMe = msg.senderId === currentUserId;
            const msgWrapper = document.createElement('div');
            msgWrapper.id = `docked-msg-${msg.id}`;
            msgWrapper.setAttribute('data-created-at', msg.createdAt);
            if (isMe) {
                msgWrapper.classList.add('phonghub-my-message');
                const oldSeen = pane.querySelector('.phonghub-seen-status');
                if (oldSeen) oldSeen.remove();
            }
            msgWrapper.style.display = 'flex';
            msgWrapper.style.flexDirection = 'column';
            msgWrapper.style.alignItems = isMe ? 'flex-end' : 'flex-start';
            msgWrapper.style.marginBottom = '4px';

            if (!isMe) {
                const senderName = document.createElement('span');
                senderName.style.fontSize = '10.5px';
                senderName.style.color = '#64748b';
                senderName.style.marginBottom = '2px';
                senderName.style.paddingLeft = '36px';
                senderName.textContent = msg.senderName;
                msgWrapper.appendChild(senderName);
            }

            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.alignItems = 'flex-end';
            row.style.gap = '8px';
            row.style.maxWidth = '85%';

            if (!isMe) {
                const miniAvatar = document.createElement('div');
                miniAvatar.style.width = '26px';
                miniAvatar.style.height = '26px';
                miniAvatar.style.borderRadius = '50%';
                miniAvatar.style.backgroundColor = getAvatarColor(msg.senderName);
                miniAvatar.style.color = '#ffffff';
                miniAvatar.style.fontSize = '11.5px';
                miniAvatar.style.fontWeight = '700';
                miniAvatar.style.display = 'flex';
                miniAvatar.style.alignItems = 'center';
                miniAvatar.style.justifyContent = 'center';
                miniAvatar.style.flexShrink = '0';
                miniAvatar.textContent = msg.senderName ? msg.senderName.charAt(0) : 'U';
                row.appendChild(miniAvatar);
            }

            const bubble = document.createElement('div');
            bubble.style.padding = '8px 12px';
            bubble.style.fontSize = '13.5px';
            bubble.style.lineHeight = '1.4';
            bubble.style.wordBreak = 'break-word';

            if (isMe) {
                bubble.style.borderRadius = '18px 18px 4px 18px';
                bubble.style.backgroundColor = '#0084ff';
                bubble.style.color = '#ffffff';
                bubble.style.boxShadow = '0 1px 3px rgba(0, 132, 255, 0.2)';
            } else {
                bubble.style.borderRadius = '18px 18px 18px 4px';
                bubble.style.backgroundColor = '#e2e8f0';
                bubble.style.color = '#0f172a';
            }
            bubble.textContent = msg.content || '';
            // Chat chỉ còn văn bản: tin cũ có ảnh/video chỉ hiện chữ kèm ghi chú, không tải tệp
            if (msg.mediaUrl) {
                const note = document.createElement('div');
                note.style.fontSize = '11.5px';
                note.style.fontStyle = 'italic';
                note.style.opacity = '0.8';
                note.textContent = 'Tệp đính kèm không còn được hỗ trợ';
                bubble.appendChild(note);
            }
            row.appendChild(bubble);

            msgWrapper.appendChild(row);

            const timeSpan = document.createElement('span');
            timeSpan.style.fontSize = '9.5px';
            timeSpan.style.color = '#94a3b8';
            timeSpan.style.marginTop = '2px';
            timeSpan.style.padding = isMe ? '0 4px 0 0' : '0 0 0 36px';
            const d = new Date(msg.createdAt);
            timeSpan.textContent = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            msgWrapper.appendChild(timeSpan);

            pane.appendChild(msgWrapper);
            scrollMessagesToBottom();
        }

        function updateSeenStatusUI(peerLastReadAtStr) {
            if (!peerLastReadAtStr || activeRoomType !== 'DIRECT') return;
            const peerReadTime = new Date(peerLastReadAtStr).getTime();
            if (isNaN(peerReadTime)) return;

            const pane = document.getElementById('phonghubDockedMessagesPane');
            if (!pane) return;

            const myMessages = pane.querySelectorAll('.phonghub-my-message');
            if (myMessages.length === 0) return;

            const lastMyMsg = myMessages[myMessages.length - 1];
            const msgCreatedAtStr = lastMyMsg.getAttribute('data-created-at');
            if (!msgCreatedAtStr) return;

            const msgTime = new Date(msgCreatedAtStr).getTime();
            if (peerReadTime >= msgTime) {
                let seenDiv = lastMyMsg.querySelector('.phonghub-seen-status');
                if (!seenDiv) {
                    pane.querySelectorAll('.phonghub-seen-status').forEach(el => el.remove());
                    seenDiv = document.createElement('div');
                    seenDiv.className = 'phonghub-seen-status';
                    seenDiv.style.fontSize = '11px';
                    seenDiv.style.color = '#64748b';
                    seenDiv.style.textAlign = 'right';
                    seenDiv.style.marginTop = '2px';
                    seenDiv.style.paddingRight = '4px';
                    seenDiv.style.display = 'flex';
                    seenDiv.style.alignItems = 'center';
                    seenDiv.style.justifyContent = 'flex-end';
                    seenDiv.style.gap = '3px';
                    seenDiv.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Đã xem</span>
                    `;
                    lastMyMsg.appendChild(seenDiv);
                    scrollMessagesToBottom();
                }
            }
        }

        function scrollMessagesToBottom() {
            const pane = document.getElementById('phonghubDockedMessagesPane');
            if (pane) pane.scrollTop = pane.scrollHeight;
        }

        function updateGlobalBadgeCount() {
            const total = cachedRooms.reduce((sum, r) => sum + (r.unreadCount || 0), 0);
            const badge = document.getElementById('phonghubGlobalUnreadBadge');
            if (badge) {
                if (total > 0) {
                    badge.style.display = 'block';
                    badge.textContent = total;
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        async function refreshUnreadBadge() {
            try {
                const res = await fetch('/api/chat/unread-count');
                if (res.ok) {
                    const data = await res.json();
                    const badge = document.getElementById('phonghubGlobalUnreadBadge');
                    const count = data.unreadCount || 0;
                    if (badge) {
                        if (count > 0) {
                            badge.style.display = 'block';
                            badge.textContent = count;
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                }
            } catch (e) {}
        }

        let chatStream = null;
        let chatStreamOpenedBefore = false;
        let chatStreamRetryTimer = null;
        let chatStreamRetryDelay = 2000;

        function initGlobalSse() {
            if (!window.EventSource) return;
            connectChatStream();
            window.addEventListener('online', reconnectChatStreamNow);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') reconnectChatStreamNow();
            });
        }

        // Có mạng lại hoặc quay lại tab: kết nối ngay thay vì chờ hết thời gian giãn
        function reconnectChatStreamNow() {
            if (chatStream && chatStream.readyState !== EventSource.CLOSED) return;
            clearTimeout(chatStreamRetryTimer);
            connectChatStream();
        }

        // Lấy những gì đã lỡ trong lúc mất kết nối: số tin chưa đọc, danh sách phòng, tin của phòng đang mở
        async function resyncAfterReconnect() {
            refreshUnreadBadge();
            loadAndRenderContacts();
            const roomId = activeFloatingRoomId;
            if (!roomId) return;
            try {
                const res = await fetch(`/api/chat/rooms/${roomId}/messages`);
                if (!res.ok || roomId !== activeFloatingRoomId) return;
                const peerLastReadHeader = res.headers.get('X-Peer-Last-Read-At');
                const messages = await res.json();
                messages.forEach(m => appendDockedMessageUI(m));
                if (peerLastReadHeader) updateSeenStatusUI(peerLastReadHeader);
            } catch (err) {
                console.error('Lỗi đồng bộ tin nhắn sau khi kết nối lại:', err);
            }
        }

        function connectChatStream() {
            const es = new EventSource('/api/chat/stream');
            chatStream = es;

            es.addEventListener('open', () => {
                chatStreamRetryDelay = 2000;
                if (chatStreamOpenedBefore) resyncAfterReconnect();
                chatStreamOpenedBefore = true;
            });

            // Mạng chập chờn thì EventSource tự kết nối lại (readyState CONNECTING). Khi proxy trả trang lỗi
            // thay cho luồng SSE (vd. Cloudflare 524) trình duyệt bỏ hẳn luồng (CLOSED), nên widget tự mở lại.
            es.addEventListener('error', () => {
                if (es !== chatStream || es.readyState !== EventSource.CLOSED) return;
                clearTimeout(chatStreamRetryTimer);
                chatStreamRetryTimer = setTimeout(connectChatStream, chatStreamRetryDelay);
                chatStreamRetryDelay = Math.min(chatStreamRetryDelay * 2, 30000);
            });

            es.addEventListener('new_message', async (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    const isCurrentChat = activeFloatingRoomId && String(msg.chatRoomId).toLowerCase() === String(activeFloatingRoomId).toLowerCase();
                    const isFromMe = String(msg.senderId).toLowerCase() === String(currentUserId).toLowerCase();

                    if (isCurrentChat) {
                        appendDockedMessageUI(msg);
                        fetch(`/api/chat/rooms/${activeFloatingRoomId}/read`, { method: 'POST' }).then(() => {
                            refreshUnreadBadge();
                            loadAndRenderContacts();
                        });
                    } else {
                        refreshUnreadBadge();
                        await loadAndRenderContacts();
                        if (!isFromMe) {
                            playMessageNotificationSound();
                            showIncomingMessageToast(msg);
                        }
                    }
                } catch (err) {
                    console.error('Lỗi nhận tin nhắn realtime SSE:', err);
                }
            });

            es.addEventListener('message_seen', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (activeFloatingRoomId && String(data.roomId).toLowerCase() === String(activeFloatingRoomId).toLowerCase() && String(data.userId).toLowerCase() !== String(currentUserId).toLowerCase()) {
                        updateSeenStatusUI(data.readAt);
                    }
                } catch (err) {
                    console.error('Lỗi nhận trạng thái seen SSE:', err);
                }
            });
        }

        function getAvatarColor(name) {
            const colors = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#db2777', '#0891b2', '#4f46e5'];
            if (!name) return colors[0];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startWidget);
        } else {
            startWidget();
        }
    })();
    </script>
</div>
