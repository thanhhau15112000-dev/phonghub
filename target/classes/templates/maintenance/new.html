<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Report Maintenance Issue')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-title-row">
        <div>
            <h1>Report Maintenance Ticket</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Create an incident report for an authorized room.</p>
        </div>
        <div>
            <a th:href="@{/maintenance}" class="btn">&larr; Back to Tickets</a>
        </div>
    </div>

    <div class="card" style="max-width: 700px;">
        <form th:action="@{/maintenance}" method="post">
            <div class="form-group">
                <label class="form-label">Select Room *</label>
                <select name="roomId" class="form-control" required>
                    <option value="">-- Choose Room --</option>
                    <option th:each="r : ${rooms}"
                            th:value="${r.getId()}"
                            th:text="'Room ' + ${r.getRoomNumber()} + ' (' + ${r.getStatus()} + ')'"
                            th:selected="${selectedRoomId != null and selectedRoomId.equals(r.getId())}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Issue Title *</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Broken water tap in bathroom" required>
            </div>

            <div class="form-group">
                <label class="form-label">Detailed Description *</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Describe the problem, location, and urgency..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Priority</label>
                    <select name="priority" class="form-control">
                        <option th:each="p : ${priorities}"
                                th:value="${p}"
                                th:text="${p}"
                                th:selected="${p.name() == 'MEDIUM'}">
                        </option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; display: flex; align-items: center; padding-top: 20px;">
                    <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" name="setRoomMaintenance" value="true" checked>
                        Set room status to MAINTENANCE
                    </label>
                </div>
            </div>

            <div style="margin-top: 16px;">
                <button type="submit" class="btn btn-primary">Submit Ticket</button>
                <a th:href="@{/maintenance}" class="btn" style="margin-left: 8px;">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
