  # ==========================================
  # 5. CHECK-IN & HANDOVER
  # ==========================================
  /api/contracts/{contractId}/check-in:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Handover]
      summary: Tạo biên bản bàn giao phòng khi khách dọn vào
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initialElectricMeter, initialWaterMeter, roomCondition]
              properties:
                initialElectricMeter:
                  type: number
                  example: 1420.5
                initialWaterMeter:
                  type: number
                  example: 35.0
                roomCondition:
                  type: string
                  example: Phòng sạch sẽ, tài sản bàn giao nguyên vẹn
                keysProvided:
                  type: string
                  example: 2 chìa khóa phòng, 1 thẻ từ cửa cuốn
                photoUrls:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        '201':
          description: Biên bản bàn giao đã lập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{contractId}/handover:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Handover]
      summary: Xem biên bản bàn giao phòng hiện tại
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/contracts/{contractId}/handover/confirm:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
