openapi: 3.1.0
info:
  title: PhongHub - Boarding House & Rental Management API
  description: >
    Tài liệu đặc tả API chuẩn kết hợp giữa kiến trúc bảo mật & Data Contract của bhm-api-spec.yaml
    và mô hình vòng đời nghiệp vụ hướng Use-Case (Task-Based REST / Hexagonal Architecture) của PhongHub.
    
    Các Nguyên Tắc Bất Biến (Domain Invariants):
    1. State Machine Protection: Không cập nhật trạng thái tùy tiện qua generic PUT/PATCH.
       Mọi chuyển đổi trạng thái quan trọng (Active, Renew, Issue, Void, Confirm, Refund) bắt buộc qua sub-resource command riêng.
    2. Hexagonal Fit: Mỗi command endpoint ánh xạ 1-1 với một Inbound Port (UseCase) ở application layer.
    3. Financial Separation: Tách bạch nghĩa vụ nợ (Invoice) và dòng tiền thực thu (Payment/Allocation), hỗ trợ thanh toán nhiều lần hoặc trả thừa.
  version: 1.0.0
  contact:
    name: PhongHub Engineering Team
    email: dev@phonghub.vn

servers:
  - url: https://api.phonghub.vn/v1
    description: Production Server
  - url: https://staging-api.phonghub.vn/v1
    description: Staging Environment
  - url: http://localhost:8080/v1
    description: Local Development

tags:
  - name: Auth
    description: Xác thực, phiên đăng nhập và quản lý mật khẩu
  - name: Me
    description: Hồ sơ cá nhân của tài khoản đang đăng nhập
  - name: Properties
    description: Quản lý tòa nhà/dãy trọ và bảng giá dịch vụ
  - name: Rooms
    description: Quản lý phòng trọ và tài sản bàn giao
  - name: Tenants
    description: Quản lý khách thuê và hồ sơ lưu trú
  - name: Contracts
    description: Vòng đời hợp đồng thuê phòng (Tạo, Kích hoạt, Gia hạn, Hủy)
  - name: Handover
    description: Biên bản bàn giao phòng, chỉ số đầu và tài sản
  - name: Meters
    description: Quản lý công tơ và ghi nhận chỉ số điện/nước
  - name: Billing & Invoices
    description: Kỳ tính cước, lập hóa đơn, phát hành và hủy hóa đơn
  - name: Payments
    description: Ghi nhận thanh toán và phân bổ tiền vào hóa đơn
  - name: Maintenance
    description: Quy trình xử lý sự cố/bảo trì phòng trọ
  - name: Checkout & Settlement
    description: Quy trình trả phòng, nghiệm thu và thanh lý tiền cọc

security:
  - bearerAuth: []

paths:
  # ==========================================
  # 1. AUTHENTICATION & USER
  # ==========================================
  /api/auth/register/customer:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản khách thuê
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập hệ thống (Customer, Staff, Landlord)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Đăng nhập thành công, trả access & refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token bằng refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Cấp token mới thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất, hủy bỏ session trên server
      responses:
        '204':
          description: Đã đăng xuất thành công
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Đổi mật khẩu khi đang đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                confirmPassword:
                  type: string
                  format: password
      responses:
        '204':
          description: Đổi mật khẩu thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Yêu cầu liên kết reset mật khẩu qua email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Yêu cầu đã được ghi nhận (tránh rò rỉ user enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Nếu email tồn tại trong hệ thống, hướng dẫn đặt lại mật khẩu đã được gửi.

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu mới bằng token từ email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword, confirmPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
                confirmPassword:
                  type: string
                  format: password
      responses:
        '204':
          description: Đặt lại mật khẩu thành công
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/me:
    get:
      tags: [Me]
      summary: Lấy thông tin tài khoản đang đăng nhập
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Me]
      summary: Cập nhật hồ sơ tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ==========================================
  # 2. PROPERTIES, ROOMS & ASSETS
  # ==========================================
  /api/properties:
    get:
      tags: [Properties]
      summary: Danh sách các nhà trọ/tòa nhà
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Danh sách phân trang
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Properties]
      summary: Tạo mới nhà trọ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/properties/{propertyId}:
    parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Properties]
      summary: Chi tiết nhà trọ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Properties]
      summary: Cập nhật thông tin nhà trọ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/properties/{propertyId}/rooms:
    parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Rooms]
      summary: Danh sách phòng thuộc nhà trọ
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RoomStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách phòng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rooms]
      summary: Tạo phòng mới trong nhà trọ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: Tạo phòng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Rooms]
      summary: Xem chi tiết phòng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rooms]
      summary: Cập nhật thông tin phòng (diện tích, giá cơ bản, số người)
      description: Không dùng endpoint này để chuyển trạng thái sang OCCUPIED (bắt buộc kích hoạt hợp đồng).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/rooms/{roomId}/assets:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Rooms]
      summary: Danh sách trang thiết bị/tài sản gắn liền với phòng
      responses:
        '200':
          description: Danh sách tài sản
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rooms]
      summary: Thêm tài sản mới vào phòng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          description: Đã thêm tài sản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Rooms]
      summary: Cập nhật hiện trạng tài sản (hỏng hóc, sửa chữa, thay mới)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 3. TENANTS
  # ==========================================
  /api/tenants:
    get:
      tags: [Tenants]
      summary: Tra cứu danh sách khách thuê
      parameters:
        - name: q
          in: query
          description: Tìm theo tên, SĐT, số CCCD
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách khách thuê
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tenants]
      summary: Tạo hồ sơ khách thuê mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '201':
          description: Đã tạo hồ sơ khách thuê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tenants]
      summary: Chi tiết hồ sơ khách thuê
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tenants]
      summary: Cập nhật thông tin khách thuê
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tenants/{tenantId}/residencies:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tenants]
      summary: Lịch sử thuê phòng của khách
      responses:
        '200':
          description: Danh sách hợp đồng thuê
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tenants/{tenantId}/invoices:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tenants]
      summary: Toàn bộ hóa đơn của khách thuê
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách hóa đơn
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tenants/{tenantId}/balance:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tenants]
      summary: Tra cứu tổng dư nợ và tiền cọc đang giữ của khách
      responses:
        '200':
          description: Số dư công nợ
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOutstandingDebt:
                    type: number
                    example: 3950000
                  totalDepositHeld:
                    type: number
                    example: 3500000
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 4. CONTRACTS & OCCUPANCY (CORE)
  # ==========================================
  /api/contracts:
    get:
      tags: [Contracts]
      summary: Danh sách hợp đồng thuê
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContractStatus'
        - name: roomId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách hợp đồng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Contracts]
      summary: Soạn thảo hợp đồng thuê mới (DRAFT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractInput'
      responses:
        '201':
          description: Hợp đồng đã được lập (DRAFT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/contracts/{contractId}:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Contracts]
      summary: Chi tiết hợp đồng thuê
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/contracts/{contractId}/activate:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Contracts]
      summary: Kích hoạt hợp đồng (ACTIVE)
      description: >
        Ràng buộc Invariant:
        - Đã thu đủ tiền đặt cọc (Deposit).
        - Phòng chuyển trạng thái sang OCCUPIED.
      responses:
        '200':
          description: Hợp đồng đã kích hoạt thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/contracts/{contractId}/renew:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Contracts]
      summary: Gia hạn thời hạn hợp đồng thuê
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEndDate]
              properties:
                newEndDate:
                  type: string
                  format: date
                newRentAmount:
                  type: number
                  example: 3700000
      responses:
        '200':
          description: Đã gia hạn hợp đồng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{contractId}/terminate:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Contracts]
