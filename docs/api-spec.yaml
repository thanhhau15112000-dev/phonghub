        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách phiếu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
