          format: uuid
    post:
      tags: [Handover]
      summary: Khách thuê xác nhận chấp thuận biên bản bàn giao
      responses:
        '200':
          description: Biên bản bàn giao đã được ký xác nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 6. METERS & SERVICE RATES
  # ==========================================
  /api/properties/{propertyId}/service-rates:
    parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Meters]
      summary: Bảng giá dịch vụ của nhà trọ (Điện, Nước, Rác, Wifi)
      responses:
        '200':
          description: Danh sách đơn giá
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRate'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Meters]
      summary: Thiết lập loại phí và đơn giá dịch vụ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceName, chargeType, pricePerUnit]
              properties:
                serviceName:
                  type: string
                  example: Điện sinh hoạt
                chargeType:
                  type: string
                  enum: [PER_KWH, PER_M3, PER_PERSON, PER_ROOM_FLAT]
                pricePerUnit:
                  type: number
                  example: 3500
      responses:
        '201':
          description: Đã tạo bảng giá dịch vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRate'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/service-rates/{rateId}:
    parameters:
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Meters]
      summary: Cập nhật đơn giá dịch vụ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pricePerUnit:
                  type: number
      responses:
        '200':
          description: Đã cập nhật giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRate'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/rooms/{roomId}/meter-readings:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Meters]
      summary: Lịch sử ghi nhận chỉ số điện/nước của phòng
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách chỉ số
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MeterReading'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Meters]
      summary: Chốt chỉ số điện/nước hàng tháng
      description: Tự động tính toán lượng tiêu thụ (consumption = currentValue - previousValue).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meterType, currentValue, readingDate]
              properties:
                meterType:
                  type: string
                  enum: [ELECTRIC, WATER]
                currentValue:
                  type: number
                  example: 1500.0
                readingDate:
                  type: string
                  format: date
                photoUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Đã lưu chỉ số công tơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==========================================
  # 7. BILLING & INVOICES (CORE)
  # ==========================================
  /api/billing-cycles:
    get:
      tags: [Billing & Invoices]
      summary: Danh sách các kỳ tính cước
      responses:
        '200':
          description: Danh sách kỳ cước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingCycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Billing & Invoices]
      summary: "Tạo kỳ tính cước mới (vd: Tháng 09/2026)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId, month, year, dueDate]
              properties:
                propertyId:
                  type: string
                  format: uuid
                month:
                  type: integer
                  example: 9
                year:
                  type: integer
                  example: 2026
                dueDate:
                  type: string
                  format: date
      responses:
        '201':
          description: Kỳ cước đã tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCycle'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/billing-cycles/{cycleId}/generate-invoices:
    parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Billing & Invoices]
      summary: Tự động tính toán & sinh hóa đơn cho toàn bộ phòng trong kỳ cước
      responses:
        '200':
          description: Đã kích hoạt lệnh sinh hóa đơn hàng loạt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  generatedCount:
                    type: integer
                    example: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/invoices:
    get:
      tags: [Billing & Invoices]
      summary: Tra cứu danh sách hóa đơn tiền phòng & dịch vụ
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: roomId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách hóa đơn
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/invoices/{invoiceId}:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Billing & Invoices]
      summary: Xem chi tiết hóa đơn
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/invoices/{invoiceId}/issue:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Billing & Invoices]
      summary: Phát hành hóa đơn (ISSUED)
      description: Khóa toàn bộ dữ liệu tính toán, bắt đầu tính nghĩa vụ thanh toán của khách.
      responses:
        '200':
          description: Hóa đơn đã phát hành chính thức
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/invoices/{invoiceId}/void:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Billing & Invoices]
      summary: Hủy hóa đơn do sai lệch tính toán (VOIDED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: Sai chỉ số điện, tính lại kỳ sau
      responses:
        '200':
          description: Hóa đơn đã bị hủy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==========================================
  # 8. PAYMENTS & ALLOCATION (CORE)
  # ==========================================
  /api/payments:
    get:
      tags: [Payments]
      summary: Danh sách giao dịch thanh toán
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Payments]
      summary: Tạo giao dịch thu tiền mới (PENDING hoặc CONFIRMED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paymentMethod]
              properties:
                amount:
                  type: number
                  example: 3950000
                paymentMethod:
                  type: string
                  enum: [BANK_TRANSFER, CASH, MOMO, VNPAY]
                transactionRef:
                  type: string
                  example: FT2609148912
                note:
                  type: string
      responses:
        '201':
          description: Giao dịch thanh toán đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/payments/{paymentId}/confirm:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Payments]
      summary: Xác nhận tiền đã vào tài khoản (CONFIRMED)
      responses:
        '200':
          description: Thanh toán đã xác nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/payments/{paymentId}/reject:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Payments]
      summary: Từ chối giao dịch thanh toán sai lệch
      responses:
        '200':
          description: Đã từ chối giao dịch
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/invoices/{invoiceId}/payments:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Payments]
      summary: Lịch sử các lần đóng tiền cho hóa đơn này
      responses:
        '200':
          description: Danh sách khoản thanh toán
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/invoices/{invoiceId}/allocate-payment:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Payments]
      summary: Phân bổ số tiền từ giao dịch thanh toán vào hóa đơn
      description: >
        Ràng buộc Kế toán:
        - Cập nhật số tiền đã trả (`paidAmount`).
        - Cập nhật trạng thái hóa đơn (`PAID` hoặc `PARTIALLY_PAID`).
        - Cho phép trả thừa (`OVERPAYMENT`) lưu vào số dư cọc/dư nợ kỳ sau.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, allocatedAmount]
              properties:
                paymentId:
                  type: string
                  format: uuid
                allocatedAmount:
                  type: number
                  example: 2000000
      responses:
        '200':
          description: Phân bổ thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

