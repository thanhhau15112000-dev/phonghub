      tags: [Maintenance]
      summary: Giao việc cho thợ/nhân viên kỹ thuật (ASSIGNED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId]
              properties:
                staffId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Đã giao việc
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/maintenance-tickets/{ticketId}/start:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Maintenance]
      summary: Bắt đầu tiến hành sửa chữa (IN_PROGRESS)
      responses:
        '200':
          description: Đang sửa chữa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/maintenance-tickets/{ticketId}/resolve:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Maintenance]
      summary: Báo cáo đã sửa xong & ghi nhận chi phí (RESOLVED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cost]
              properties:
                cost:
                  type: number
                  example: 120000
                resolutionNotes:
                  type: string
                  example: Đã thay gioăng cao su mới
      responses:
        '200':
          description: Đã xử lý xong
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/maintenance-tickets/{ticketId}/verify:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Maintenance]
      summary: Khách thuê hoặc chủ trọ nghiệm thu hoàn tất (VERIFIED)
      responses:
        '200':
          description: Nghiệm thu thành công, đóng phiếu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 10. CHECKOUT & SETTLEMENT (CORE)
  # ==========================================
  /api/contracts/{contractId}/checkout-request:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkout & Settlement]
      summary: Khách gửi yêu cầu trả phòng (báo trước ngày dọn đi)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedCheckoutDate]
              properties:
                expectedCheckoutDate:
                  type: string
                  format: date
                reason:
                  type: string
      responses:
        '200':
          description: Đã ghi nhận yêu cầu trả phòng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{contractId}/checkout:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Checkout & Settlement]
      summary: Xem toàn bộ hồ sơ nghiệm thu và quyết toán trả phòng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{contractId}/final-meter-reading:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkout & Settlement]
      summary: Chốt chỉ số điện/nước cuối cùng vào ngày bàn giao trả phòng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finalElectricMeter, finalWaterMeter]
              properties:
                finalElectricMeter:
                  type: number
                  example: 1620.0
                finalWaterMeter:
                  type: number
                  example: 42.5
      responses:
        '200':
          description: Đã lưu chỉ số điện nước cuối cùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{contractId}/inspection:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkout & Settlement]
      summary: Nghiệm thu bàn giao tài sản và khấu trừ hư hỏng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [damageCharges, roomConditionAfterCheckout]
              properties:
                damageCharges:
                  type: number
                  example: 200000
                damageDetails:
                  type: string
                  example: Gãy bản lề cửa sổ phòng ngủ
                roomConditionAfterCheckout:
                  type: string
                  example: Vệ sinh đạt, hư hỏng 1 bản lề
      responses:
        '200':
          description: Đã lưu kết quả nghiệm thu phòng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{contractId}/settlement/preview:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkout & Settlement]
      summary: Xem trước bảng quyết toán trả phòng
      description: >
        Công thức tự động:
        Deposit (Tiền cọc)
        - Tiền phòng chưa thanh toán
        - Tiền điện nước chốt cuối
        - Phí khấu trừ hư hỏng
        - Chi phí dịch vụ khác
        = Tiền cọc thực trả (Refundable Deposit)
      responses:
        '200':
          description: Bảng tính quyết toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{contractId}/settlement/confirm:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkout & Settlement]
      summary: Chốt quyết toán thanh lý hợp đồng
      description: Chuyển trạng thái hợp đồng sang TERMINATED, phòng trở lại trạng thái AVAILABLE.
      responses:
        '200':
          description: Đã xác nhận quyết toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/contracts/{contractId}/deposit/refund:
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkout & Settlement]
      summary: Xác nhận đã hoàn trả tiền cọc thừa cho khách
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refundAmount, refundMethod]
              properties:
                refundAmount:
                  type: number
                  example: 3000000
                refundMethod:
                  type: string
                  enum: [BANK_TRANSFER, CASH]
                transactionRef:
                  type: string
                  example: FT2609209999
      responses:
        '200':
          description: Đã hoàn tất thanh lý tiền cọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

# ==========================================
# COMPONENTS (REUSABLE SCHEMAS & CONTRACTS)
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Số bản ghi mỗi trang (tối đa 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortParam:
      name: sort
      in: query
      description: 'Trường sắp xếp, thêm dấu "-" ở đầu để sắp xếp giảm dần (vd: -createdAt)'
      schema:
        type: string
        example: -createdAt

  responses:
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không đủ quyền hạn (Role) để thực hiện hành động này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái hoặc trùng lặp dữ liệu duy nhất
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    Role:
      type: string
      enum: [TENANT, STAFF, LANDLORD_ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    RoomStatus:
      type: string
      enum: [AVAILABLE, OCCUPIED, MAINTENANCE, RESERVED]

    ContractStatus:
      type: string
      enum: [DRAFT, ACTIVE, EXPIRED, TERMINATED]

    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PAID, PARTIALLY_PAID, OVERDUE, VOIDED]

    PaymentStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, REVERSED]

    TicketStatus:
      type: string
      enum: [REPORTED, ASSIGNED, IN_PROGRESS, RESOLVED, VERIFIED, REJECTED]

    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: Không tìm thấy dữ liệu yêu cầu.

    ValidationError:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
          example: Dữ liệu đầu vào không hợp lệ.
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: roomNumber
              message:
                type: string
                example: Số phòng không được để trống.

    PaginatedMeta:
      type: object
      required: [meta]
      properties:
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 45
            totalPages:
              type: integer
              example: 3

    RegisterRequest:
      type: object
      required: [email, password, fullName, phone]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Tối thiểu 8 ký tự, có chữ hoa, chữ thường và số
        fullName:
          type: string
        phone:
          type: string

    User:
      type: object
      required: [id, email, fullName, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time

    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    Property:
      type: object
      required: [id, name, address, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Nhà trọ PhongHub Tân Bình
        address:
          type: string
          example: 123 Hoàng Hoa Thám, P.13, Tân Bình, TP.HCM
        description:
          type: string
        totalRooms:
          type: integer
          example: 15
        createdAt:
          type: string
          format: date-time

    PropertyInput:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
        description:
          type: string

    Room:
      type: object
      required: [id, propertyId, roomNumber, status, basePrice, createdAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        roomNumber:
          type: string
          example: '101'
        floor:
          type: integer
          example: 1
        areaSqm:
          type: number
          example: 25.5
        basePrice:
          type: number
          example: 3500000
        maxOccupants:
          type: integer
          example: 3
        status:
          $ref: '#/components/schemas/RoomStatus'
        createdAt:
          type: string
          format: date-time

    RoomInput:
      type: object
      required: [roomNumber, basePrice]
      properties:
        roomNumber:
          type: string
        floor:
          type: integer
        areaSqm:
          type: number
        basePrice:
          type: number
        maxOccupants:
          type: integer

    Asset:
      type: object
      required: [id, roomId, name, quantity, condition]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        name:
          type: string
          example: Máy lạnh Daikin 1.5 HP
        serialNumber:
          type: string
          example: DK-892182
        quantity:
          type: integer
          example: 1
        condition:
          type: string
          example: Mới 98%, hoạt động tốt
        estimatedValue:
          type: number
          example: 8000000

    AssetInput:
      type: object
      required: [name, quantity, condition]
      properties:
        name:
          type: string
        serialNumber:
          type: string
        quantity:
          type: integer
        condition:
          type: string
        estimatedValue:
          type: number

    Tenant:
      type: object
      required: [id, fullName, identityCardNumber, phone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        fullName:
          type: string
          example: Lê Thanh Hậu
        identityCardNumber:
          type: string
          example: '079200001234'
        phone:
          type: string
          example: '0909123456'
        email:
          type: string
          format: email
        permanentAddress:
          type: string
          example: Bình Định
        createdAt:
          type: string
          format: date-time

    TenantInput:
      type: object
      required: [fullName, identityCardNumber, phone]
      properties:
        fullName:
          type: string
        identityCardNumber:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        permanentAddress:
          type: string

    Contract:
      type: object
      required: [id, propertyId, roomId, primaryTenantId, depositAmount, rentAmount, startDate, endDate, status]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        primaryTenantId:
          type: string
          format: uuid
        depositAmount:
          type: number
          example: 3500000
        rentAmount:
          type: number
          example: 3500000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        paymentDay:
          type: integer
          example: 5
        status:
          $ref: '#/components/schemas/ContractStatus'
        createdAt:
          type: string
          format: date-time

    ContractInput:
      type: object
      required: [propertyId, roomId, primaryTenantId, depositAmount, rentAmount, startDate, endDate]
      properties:
        propertyId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        primaryTenantId:
          type: string
          format: uuid
        depositAmount:
          type: number
        rentAmount:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        paymentDay:
          type: integer
          default: 5

    HandoverRecord:
      type: object
      required: [contractId, initialElectricMeter, initialWaterMeter, roomCondition, isConfirmedByTenant]
      properties:
        contractId:
          type: string
          format: uuid
        initialElectricMeter:
          type: number
          example: 1420.5
        initialWaterMeter:
          type: number
          example: 35.0
        roomCondition:
          type: string
          example: Phòng sơn mới, đèn quạt hoạt động tốt
        keysProvided:
          type: string
          example: 2 chìa khóa cơ, 1 thẻ từ
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        isConfirmedByTenant:
          type: boolean
          example: true
        confirmedAt:
          type: string
          format: date-time

    MeterReading:
      type: object
      required: [id, roomId, meterType, previousValue, currentValue, consumption, readingDate]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        meterType:
          type: string
          enum: [ELECTRIC, WATER]
        previousValue:
          type: number
          example: 1420.5
        currentValue:
          type: number
          example: 1500.0
        consumption:
          type: number
          example: 79.5
        readingDate:
          type: string
          format: date
        photoUrl:
          type: string
          format: uri

    ServiceRate:
      type: object
      required: [id, propertyId, serviceName, chargeType, pricePerUnit]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        serviceName:
          type: string
          example: Điện sinh hoạt
        chargeType:
          type: string
          enum: [PER_KWH, PER_M3, PER_PERSON, PER_ROOM_FLAT]
        pricePerUnit:
          type: number
          example: 3500

    BillingCycle:
      type: object
      required: [id, propertyId, month, year, dueDate]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        month:
          type: integer
          example: 9
        year:
          type: integer
          example: 2026
        dueDate:
          type: string
          format: date
        totalInvoicesGenerated:
          type: integer
          example: 15

    Invoice:
      type: object
      required: [id, contractId, roomId, tenantId, cycleMonth, cycleYear, totalAmount, paidAmount, status]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        cycleMonth:
          type: integer
          example: 9
        cycleYear:
          type: integer
          example: 2026
        rentAmount:
          type: number
          example: 3500000
        utilityAmount:
          type: number
          example: 450000
        totalAmount:
          type: number
          example: 3950000
        paidAmount:
          type: number
          example: 3950000
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        lineItems:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
                example: "Tiền điện (1420 -> 1500: 80 kWh x 3,500đ)"
              amount:
                type: number
                example: 280000

    Payment:
      type: object
      required: [id, amount, paymentMethod, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          example: 3950000
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, CASH, MOMO, VNPAY]
        transactionRef:
          type: string
          example: FT2609148912
        status:
          $ref: '#/components/schemas/PaymentStatus'
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    MaintenanceTicket:
      type: object
      required: [id, roomId, title, status, priority, createdAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        title:
          type: string
          example: Vòi xịt toilet bị rò rỉ nước
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TicketPriority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        cost:
          type: number
          example: 120000
        createdAt:
          type: string
          format: date-time

    Settlement:
      type: object
      required: [contractId, depositAmount, outstandingRent, outstandingUtilities, damageCharges, refundableAmount, status]
      properties:
        contractId:
          type: string
          format: uuid
        depositAmount:
          type: number
          example: 3500000
        outstandingRent:
          type: number
          example: 0
        outstandingUtilities:
          type: number
          example: 250000
        damageCharges:
          type: number
          example: 200000
          description: Khấu trừ hư hỏng bản lề
        otherCharges:
          type: number
          example: 50000
          description: Phí vệ sinh phòng
        refundableAmount:
          type: number
          example: 3000000
          description: Số tiền cọc thực trả (Deposit - Rent - Utilities - Damages - Other)
        status:
          type: string
          enum: [PREVIEW, CONFIRMED, REFUNDED]
