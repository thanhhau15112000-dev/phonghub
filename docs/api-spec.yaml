                          $ref: '#/components/schemas/MaintenanceTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Maintenance]
      summary: Tạo phiếu báo hỏng thiết bị/sự cố (REPORTED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
